name: V367 single active surface

on:
  push:
    branches:
      - v367-single-active-surface
  workflow_dispatch:

jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Run V367 shell interaction contract
        run: python web/test_v367_single_active_surface.py .

      - name: Build production image
        run: docker build --progress=plain -t gsf-v367 .

      - name: Start production image
        run: |
          docker run -d --name gsf-v367-run -p 8080:8080 \
            -e PORT=8080 -e GSF_WEB_MODE=1 gsf-v367

      - name: Verify startup, health, and V367 runtime gate
        run: |
          set -eu
          for i in $(seq 1 90); do
            if ! docker inspect -f '{{.State.Running}}' gsf-v367-run 2>/dev/null | grep -q true; then
              echo 'Container exited before becoming healthy'
              docker logs gsf-v367-run || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              docker logs gsf-v367-run > /tmp/gsf-v367.log 2>&1 || true
              grep -q 'V367 single active surface applied' /tmp/gsf-v367.log
              grep -q 'V367 SINGLE ACTIVE SURFACE CONTRACT: PASS' /tmp/gsf-v367.log
              echo 'V367 production container: HEALTHY + RUNTIME GATE PASS'
              tail -n 220 /tmp/gsf-v367.log
              exit 0
            fi
            sleep 2
          done
          echo 'Timed out waiting for V367 container'
          docker logs gsf-v367-run || true
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker logs gsf-v367-run || true
