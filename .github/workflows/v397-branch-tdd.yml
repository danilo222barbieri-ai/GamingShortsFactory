name: V397 Branch TDD

on:
  push:
    branches:
      - v397-structural-hardening

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: V397 structural contract
        run: python web/test_v397_production_hardening.py .
      - name: Compile hardened Python surfaces
        run: python -m py_compile web/direct_upload_server.py web/runtime_smoke_v107.py
