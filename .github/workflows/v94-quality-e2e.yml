name: V94 quality production E2E

on:
  push:
    branches:
      - v94-quality-e2e

jobs:
  quality-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Generate reaction gameplay sample
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=640x360:rate=30:duration=20" \
            -f lavfi -i "sine=frequency=260:sample_rate=48000:duration=20" \
            -filter:a "volume=0.05" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k -shortest q1.mp4

          espeak-ng -w reaction_voice.wav -s 165 -a 190 "Oh my god! No no no! What a kill! Let's go! Victory! Clutch! What a play!"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=640x360:rate=30:duration=20" \
            -f lavfi -i "sine=frequency=300:sample_rate=48000:duration=20" \
            -i reaction_voice.wav \
            -filter_complex "[1:a]volume=0.07[base];[2:a]adelay=2500|2500,volume=1.6[voice];[base][voice]amix=inputs=2:duration=first:dropout_transition=1[a]" \
            -map 0:v -map "[a]" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -shortest q2.mp4

          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=640x360:rate=30:duration=20" \
            -f lavfi -i "sine=frequency=1000:sample_rate=48000:duration=20" \
            -filter:a "volume='if(lt(t,8),0.15,0.85)':eval=frame" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -shortest q3.mp4

          printf "file 'q1.mp4'\nfile 'q2.mp4'\nfile 'q3.mp4'\n" > concat.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i concat.txt -c copy quality_gameplay.mp4

      - name: Run auto-final quality path
        env:
          APP_URL: https://gaming-shorts-factory-v79-production.up.railway.app/
        run: |
          cat > quality-e2e.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const out='v94-quality-artifacts';
          fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1100},acceptDownloads:true});
          const page=await context.newPage();
          page.setDefaultTimeout(30000);

          try{
            await page.goto(process.env.APP_URL,{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('input[type="file"]').waitFor({state:'attached',timeout:60000});
            await page.locator('input[type="file"]').setInputFiles('quality_gameplay.mp4');
            await page.getByText('Video caricato',{exact:false}).waitFor({state:'visible',timeout:120000});

            const b15=page.getByRole('button',{name:/^15s$/i}).first();
            await b15.click();

            const reaction=page.getByRole('button').filter({hasText:'Reazioni'}).first();
            await reaction.waitFor({state:'visible',timeout:30000});
            await reaction.click();
            await page.waitForTimeout(600);

            const create=page.getByRole('button',{name:'CREA CON AI',exact:true});
            await create.click();
            await page.getByText('Scegli il tuo momento',{exact:false}).waitFor({state:'visible',timeout:300000});
            await page.waitForFunction(()=>{
              const labels=[...document.querySelectorAll('button')].map(b=>(b.innerText||'').trim());
              return labels.filter(t=>/SCEGLI QUESTO|SELEZIONATA/i.test(t)).length>=3;
            },null,{timeout:300000});

            const body=await page.locator('body').innerText();
            fs.writeFileSync(out+'/results-body.txt',body);

            const choose=page.getByRole('button',{name:/SCEGLI QUESTO/i}).first();
            await choose.waitFor({state:'visible',timeout:30000});
            await choose.click();
            await page.waitForTimeout(1200);

            const finalBtn=page.getByRole('button',{name:/CREA SHORT FINALE/i});
            await finalBtn.waitFor({state:'visible',timeout:60000});
            await finalBtn.click();

            const dlBox=page.locator('[data-testid="stDownloadButton"]').last();
            await dlBox.waitFor({state:'visible',timeout:360000});
            let trigger=dlBox.locator('button');
            if(!(await trigger.count())) trigger=dlBox.locator('a');

            const dlPromise=page.waitForEvent('download',{timeout:60000});
            await trigger.first().click();
            const dl=await dlPromise;
            const p=out+'/auto-final.mp4';
            await dl.saveAs(p);

            console.log('AUTO FINAL BYTES',fs.statSync(p).size);
            await page.screenshot({path:out+'/final-page.png',fullPage:true});
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          node quality-e2e.mjs

      - name: Extract visual quality frames
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json v94-quality-artifacts/auto-final.mp4 | tee v94-quality-artifacts/ffprobe.json
          ffmpeg -hide_banner -loglevel error -ss 0.6 -i v94-quality-artifacts/auto-final.mp4 -frames:v 1 -y v94-quality-artifacts/frame-0.6.png
          ffmpeg -hide_banner -loglevel error -ss 1.3 -i v94-quality-artifacts/auto-final.mp4 -frames:v 1 -y v94-quality-artifacts/frame-1.3.png
          ffmpeg -hide_banner -loglevel error -ss 4.5 -i v94-quality-artifacts/auto-final.mp4 -frames:v 1 -y v94-quality-artifacts/frame-4.5.png
          ffmpeg -hide_banner -loglevel error -ss 7.0 -i v94-quality-artifacts/auto-final.mp4 -frames:v 1 -y v94-quality-artifacts/frame-7.0.png

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v94-quality-e2e
          path: v94-quality-artifacts/
          if-no-files-found: warn
