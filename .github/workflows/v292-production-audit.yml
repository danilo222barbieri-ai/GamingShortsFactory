name: V292 Production Audit

on:
  push:
    branches:
      - audit/full-production-2026-10-05
  workflow_dispatch:

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build exact production web image
        run: docker build --progress=plain -t gsf-v292 .

      - name: V292 semantic regression in web image
        run: |
          docker run --rm --entrypoint /bin/sh gsf-v292 -lc \
            'python /app/web/fix_v292_semantic_resilience.py && python /app/web/test_v292_semantic_circuit.py'

      - name: Build exact production worker image
        run: docker build --progress=plain -f web/Dockerfile.worker -t gsf-v292-worker .

      - name: V292 semantic and AI profile regression in worker image
        run: |
          docker run --rm --entrypoint python gsf-v292-worker /app/web/test_v292_semantic_circuit.py
          docker run --rm --entrypoint python gsf-v292-worker /app/web/test_v292_ai_profiles.py

      - name: Start production web image
        run: |
          docker run -d --name gsf-v292-run -p 8080:8080 \
            -e PORT=8080 -e GSF_WEB_MODE=1 gsf-v292

      - name: Wait for production HTTP health
        run: |
          set -eu
          for i in $(seq 1 90); do
            if ! docker inspect -f '{{.State.Running}}' gsf-v292-run 2>/dev/null | grep -q true; then
              echo 'Container exited before becoming healthy'
              docker logs gsf-v292-run || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo 'V292 production container: HEALTHY'
              exit 0
            fi
            sleep 2
          done
          echo 'Timed out waiting for V292 container'
          docker logs gsf-v292-run || true
          exit 1

      - name: Current navigation and AI contracts
        run: |
          set -eu
          APP=/app/GamingShortsFactory_V154_STRUCTURAL_HOME.py
          docker exec gsf-v292-run python /app/web/test_v285_creator_hub_clicks.py /app/web/creator_hub_v156_component/index.html
          docker exec gsf-v292-run python /app/web/test_v286_global_gamebar.py /app/web/creator_hub_v156_component/index.html $APP
          docker exec gsf-v292-run python /app/web/test_v287_profile_overview.py /app/web/creator_hub_v156_component/index.html $APP
          docker exec gsf-v292-run python /app/web/test_v288_ai_journey.py /app/web/ai_v221_component/index.html /app/web/home_v154_component/index.html /app/web/editor_2027_component/index.html $APP
          docker exec gsf-v292-run python /app/web/test_v289_share_final.py /app/web/share_v156_component/index.html $APP
          docker exec gsf-v292-run python /app/web/test_v291_ai_engine_bridge.py /app/web/home_v154_component/index.html $APP
          docker exec gsf-v292-run python /app/web/test_v292_semantic_circuit.py
          docker exec gsf-v292-run python /app/web/test_v292_ai_profiles.py

      - name: Render upload editor memory contracts
        run: |
          set -eu
          APP=/app/GamingShortsFactory_V154_STRUCTURAL_HOME.py
          docker exec gsf-v292-run python /app/web/test_v105_no_audio_master.py $APP
          docker exec gsf-v292-run python /app/web/test_v105_render_contract.py
          docker exec gsf-v292-run python /app/web/test_v105_upload_policy.py
          docker exec gsf-v292-run python /app/web/test_v105_worker_image.py
          docker exec gsf-v292-run python /app/web/test_v107_ffmpeg_smoke.py
          docker exec gsf-v292-run python /app/web/test_v107_mobile_codec_smoke.py
          docker exec gsf-v292-run python /app/web/test_editor_2027_component.py $APP
          docker exec gsf-v292-run python /app/web/test_v145_content_memory.py /app/web/direct_upload_server.py $APP

      - name: Runtime error scan
        run: |
          set -eu
          docker logs gsf-v292-run > /tmp/gsf-v292.log 2>&1 || true
          if grep -E 'Traceback|Unhandled exception|Container exited|GSF worker failed' /tmp/gsf-v292.log; then
            echo 'Runtime error marker detected'
            cat /tmp/gsf-v292.log
            exit 1
          fi
          tail -n 200 /tmp/gsf-v292.log

      - name: Show logs on failure
        if: failure()
        run: docker logs gsf-v292-run || true
