name: V428 apply once

on:
  push:
    branches:
      - chat/mobile-polish-user-notes-20261023
    paths:
      - '.github/workflows/v428-apply-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python tools/apply_v428_mobile_polish.py
      - name: Verify targeted regressions
        run: python -m pytest -q tests/test_mobile_polish_v428.py
      - name: Verify JavaScript syntax
        run: node --check web/game_editor_mobile_component/editor.mjs
      - name: Commit runtime changes
        run: |
          set -euo pipefail
          git config user.name 'GSF Coordinator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/game_editor_mobile_component/editor.mjs \
                  web/game_editor_mobile_component/index.html \
                  web/home_v154_component/index.html \
                  web/direct_upload_server.py \
                  web/ai_v221_component/index.html
          git diff --cached --check
          git diff --cached --quiet && { echo 'No runtime changes produced'; exit 1; }
          git commit -m 'fix: apply approved mobile polish v428'
          git push origin HEAD:chat/mobile-polish-user-notes-20261023
