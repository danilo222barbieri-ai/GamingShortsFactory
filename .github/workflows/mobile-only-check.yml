name: GSF mobile-only check

on:
  push:
    branches:
      - gsf-mobile-only
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Gate contract
        run: python web/test_mobile_only_gate.py web/nginx.conf.template web/mobile_only_gate.html

      - name: Mobile AI contract
        run: python web/test_mobile_ai_surface.py .

      - name: Mobile scroll contract
        run: python web/test_mobile_scroll_contract.py .

      - name: Build production image
        run: docker build -t gsf-mobile-only:${{ github.sha }} .

      - name: Start production image
        run: |
          docker run -d --name gsf-mobile-only \
            -e PORT=8080 \
            -p 18080:8080 \
            gsf-mobile-only:${{ github.sha }}

      - name: Wait for HTTP
        run: |
          set -eu
          for i in $(seq 1 60); do
            code=$(curl -sS -o /tmp/mobile-root.html -w '%{http_code}' \
              -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1' \
              http://127.0.0.1:18080/ || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs gsf-mobile-only
          exit 1

      - name: Mobile root reaches app
        run: |
          set -eu
          curl -fsS \
            -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1' \
            http://127.0.0.1:18080/ > /tmp/mobile.html
          if grep -Fq 'GSF è disponibile da smartphone' /tmp/mobile.html; then
            echo 'mobile client was incorrectly gated'
            exit 1
          fi

      - name: Desktop root is gated
        run: |
          set -eu
          curl -fsS \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36' \
            http://127.0.0.1:18080/ > /tmp/desktop.html
          grep -Fq 'GSF è disponibile da smartphone' /tmp/desktop.html

      - name: Desktop internal surfaces are gated
        run: |
          set -eu
          for path in ai-v221/ editor-live/ creator-hub-v156/ share-v156/; do
            curl -fsS \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36' \
              "http://127.0.0.1:18080/$path" > /tmp/gate.html
            grep -Fq 'GSF è disponibile da smartphone' /tmp/gate.html
          done

      - name: Legacy desktop routes no longer expose UI
        run: |
          set -eu
          for path in desktop-home desktop-preview; do
            headers=$(curl -sSI -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' "http://127.0.0.1:18080/$path")
            printf '%s\n' "=== $path ===" "$headers"
            echo "$headers" | grep -Eq '^HTTP/.* 30[12]'
            echo "$headers" | grep -Eiq '^location: (https?://[^/]+)?/'
          done

      - name: Container logs on failure
        if: failure()
        run: docker logs gsf-mobile-only || true
