name: V94 quality source audit

on:
  push:
    branches:
      - v94-short-quality

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct V93
        run: |
          sudo mkdir -p /app
          sudo cp -r src_payload /app/src_payload
          sudo cp -r web /app/web
          sudo chown -R "$USER":"$USER" /app
          python - <<'PY'
          import base64,gzip,pathlib
          p=pathlib.Path('/app/src_payload')
          s=''.join(x.read_text() for x in sorted(p.glob('gsf_v77.py.gz.b64.part*')))
          pathlib.Path('/app/GamingShortsFactory_V77_WEB_READY.py').write_bytes(gzip.decompress(base64.b64decode(s)))
          PY
          python /app/web/apply_v78_mobile_patch.py
          python /app/web/apply_v79_session_social_patch.py
          python /app/web/apply_v80_ui_auto_sub_patch.py
          python /app/web/apply_v80_1_hotfix.py
          python /app/web/apply_v80_2_render_hotfix.py
          python /app/web/apply_v81_mobile_tablet_patch.py
          python /app/web/apply_v82_fixpack.py
          python /app/web/apply_v83_upload_fix.py
          python /app/web/apply_v84_mobile_media_upload_fix.py
          python /app/web/apply_v85_upload_cleanup.py
          python /app/web/apply_v86_single_upload_circle.py
          python /app/web/apply_v87_upload_persist.py
          python /app/web/apply_v88_persistent_loaded_circle.py
          python /app/web/apply_v89_decoupled_upload_visual.py
          python /app/web/apply_v90_upload_visual_fix.py
          python /app/web/apply_v91_roadmap_polish.py
          python /app/web/apply_v92_ai_reaction_quality.py
          python /app/web/apply_v93_deep_stability.py

      - name: Inspect quality paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/app/GamingShortsFactory_V93_DEEP_STABILITY.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          needles=[
            'def _gsf_score_ai_window',
            'def _gsf_short_worthiness',
            'def _gsf_smart_reframe_filter',
            'def _gsf_render_core',
            'def _gsf_render_auto_master',
            'hook',
            'subtitle',
            'sottotit',
            'drawtext',
            'word_timestamps',
            'caption',
          ]
          seen=set()
          for n,line in enumerate(lines,1):
              if any(k.lower() in line.lower() for k in needles):
                  if any(abs(n-x)<20 for x in seen): 
                      continue
                  seen.add(n)
                  print(f'=== HIT {n}: {line}')
                  for m in range(max(1,n-35),min(len(lines),n+90)+1):
                      print(f'SRC {m}: {lines[m-1]}')
                  print('---')
          PY

      - name: Extract exact quality functions
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('/app/GamingShortsFactory_V93_DEEP_STABILITY.py')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines()
          tree=ast.parse(s)
          names={
            '_gsf_score_ai_window',
            '_gsf_short_worthiness',
            '_gsf_smart_reframe_filter',
            '_gsf_render_core',
            '_gsf_render_auto_master',
            '_gsf_write_render_ass',
            '_gsf_hook_from_diag',
          }
          for node in tree.body:
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in names:
                  print(f'###FUNC {node.name} {node.lineno}-{node.end_lineno}')
                  for n in range(node.lineno,node.end_lineno+1):
                      print(f'{n}: {lines[n-1]}')
          PY
