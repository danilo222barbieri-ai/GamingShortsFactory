name: V367.1 touch recovery

on:
  push:
    branches:
      - v367-1-touch-recovery
  workflow_dispatch:

jobs:
  touch-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run V367.1 touch recovery contract
        run: python web/test_v367_1_touch_recovery.py .
      - name: Build production image
        run: docker build --progress=plain -t gsf-v3671 .
      - name: Start production image
        run: docker run -d --name gsf-v3671-run -p 8080:8080 -e PORT=8080 -e GSF_WEB_MODE=1 gsf-v3671
      - name: Verify startup and health
        run: |
          set -eu
          for i in $(seq 1 90); do
            if ! docker inspect -f '{{.State.Running}}' gsf-v3671-run 2>/dev/null | grep -q true; then
              docker logs gsf-v3671-run || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              docker logs gsf-v3671-run > /tmp/gsf-v3671.log 2>&1 || true
              grep -q 'V367.1 TOUCH RECOVERY CONTRACT: PASS' /tmp/gsf-v3671.log || true
              if grep -q 'V367 single active surface applied' /tmp/gsf-v3671.log; then
                echo 'V367 arbiter still active in runtime'
                cat /tmp/gsf-v3671.log
                exit 1
              fi
              echo 'V367.1 production container: HEALTHY, V367 arbiter absent'
              tail -n 220 /tmp/gsf-v3671.log
              exit 0
            fi
            sleep 2
          done
          docker logs gsf-v3671-run || true
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker logs gsf-v3671-run || true
