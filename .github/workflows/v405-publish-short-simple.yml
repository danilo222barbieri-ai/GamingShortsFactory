name: V405 Publish Short Simple

on:
  pull_request:
    paths:
      - 'scripts/apply_v405_publish_short.py'
      - 'web/publish_short_v405_component/index.html'
      - 'web/test_v405_publish_short_simple.py'
      - '.github/workflows/v405-publish-short-simple.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v405_publish_short.py'
      - 'web/publish_short_v405_component/index.html'
      - 'web/test_v405_publish_short_simple.py'
      - '.github/workflows/v405-publish-short-simple.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile scripts/apply_v405_publish_short.py web/test_v405_publish_short_simple.py
      - name: Publication contract
        run: python web/test_v405_publish_short_simple.py
      - name: HTML parse
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              pass
          parser = Parser()
          parser.feed(Path('web/publish_short_v405_component/index.html').read_text(encoding='utf-8'))
          print('V405 HTML PARSE: PASS')
          PY
