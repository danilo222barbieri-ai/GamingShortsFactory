name: V398 AI Semantic TDD

on:
  push:
    branches:
      - v398-ai-semantic-resilience
  pull_request:
    branches:
      - main

jobs:
  semantic-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: V398 transient-provider classifier
        run: |
          PYTHONPATH=web python - <<'PY'
          from semantic_video_v114 import is_retryable_provider_error
          retryable = (
              "503 UNAVAILABLE model high demand",
              "Gemini Generate Content video response empty",
              "Expecting value: line 1 column 1 (char 0)",
              "ReadTimeout timed out",
          )
          for message in retryable:
              assert is_retryable_provider_error(message), message
          assert not is_retryable_provider_error("400 INVALID_ARGUMENT malformed request")
          print("V398 transient-provider classifier: PASS")
          PY
      - name: V398 static timeout contract
        run: |
          python - <<'PY'
          from pathlib import Path
          semantic=Path("web/semantic_video_v114.py").read_text(encoding="utf-8")
          assert 'http_options=types.HttpOptions(timeout=' in semantic
          print("V398 static Generate Content timeout: PASS")
          PY
