name: GSF CI

# One job for every pull request: all fast contracts that used to run as 12
# separate per-version workflows (each billed at least one runner minute).
# Docker builds and the runtime smoke live in the GSF Production Gate.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gsf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-web.txt

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check pytest bandit pillow cryptography==50.0.1

      - name: Canonical UI pipeline guard
        run: python tests/test_canonical_ui_pipeline.py

      - name: Syntax
        run: |
          python -m compileall -q app.py web gsf_core gsf_alive.py gsf_alive_notifications.py gsf_editor_v403.py gsf_project_state.py tools tests

      - name: Mobile Game Editor JavaScript contracts
        run: |
          node --test tests/js/mobile_game_editor_state.test.mjs
          node --check web/game_editor_mobile_component/editor.mjs
          node --check web/game_editor_mobile_component/editor_state.mjs

      - name: Production, security and UI contracts
        run: |
          set -e
          python web/test_v397_production_hardening.py .
          python web/test_v410_security_hardening.py .
          python web/test_v404_crea_con_ia_simple.py
          python web/test_v412_ai_engines.py
          python web/test_v405_publish_short_simple.py
          python web/test_v413_publish_multi.py
          python web/test_v403_creator_hub_simplified.py
          python tests/test_creator_hub_redesign_v415.py

      - name: AI, render and worker contracts
        run: |
          set -e
          PYTHONPATH=web python - <<'PY'
          from pathlib import Path
          from semantic_video_v114 import is_retryable_provider_error
          for message in ("503 UNAVAILABLE model high demand",
                          "Gemini Generate Content video response empty",
                          "Expecting value: line 1 column 1 (char 0)",
                          "ReadTimeout timed out"):
              assert is_retryable_provider_error(message), message
          assert not is_retryable_provider_error("400 INVALID_ARGUMENT malformed request")
          assert 'http_options=types.HttpOptions(timeout=' in Path("web/semantic_video_v114.py").read_text(encoding="utf-8")
          print("V398 semantic resilience: PASS")
          PY
          PYTHONPATH=web python web/test_v399_quality_supreme.py
          PYTHONPATH=web python web/test_v400_ai_hidpi.py
          python web/test_v401_performance_stability.py
          python web/test_v402_game_brain_auto_highlights.py

      - name: Core, state, Alive, Game Editor and coordination tests
        run: |
          set -e
          python -m pytest -q tests
          python -m unittest discover -s tools -p 'test_gsf_*.py'

      - name: V410 hardening is canonical (patches must be a no-op)
        run: |
          set -euo pipefail
          rm -rf /tmp/v410-canonical && mkdir -p /tmp/v410-canonical
          git ls-files -z | xargs -0 -I{} cp --parents {} /tmp/v410-canonical/
          (cd /tmp/v410-canonical && python web/fix_v410_security_hardening.py . && python web/fix_v410_1_edge_identity.py .)
          for f in web/nginx.conf.template web/direct_upload_server.py; do
            cmp -s "$f" "/tmp/v410-canonical/$f" || { echo "::error title=V410::$f would still be modified by the V410 patch"; exit 1; }
          done

      - name: Dependency audit with pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-web.txt

      - name: Dependency lock and source security scan
        run: |
          python -m pip install --disable-pip-version-check --dry-run -r requirements-web.txt -c constraints-web.txt
          bandit -q -r web -x 'web/test_*,tests' -lll -f custom --msg-template '::error file={relpath},line={line},title=bandit {test_id}::{severity} {msg}'

  oauth-hotfix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chat/complete-existing-social-oauth-meta-tiktok-twitc-eb5961'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/complete-existing-social-oauth-meta-tiktok-twitc-eb5961
          fetch-depth: 0

      - name: Patch canonical OAuth files
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          def replace_in_block(path, start_marker, end_marker, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              a=text.index(start_marker)
              b=text.index(end_marker,a)
              block=text[a:b]
              n=block.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 block match, got {n}: {old[:100]!r}')
              block=block.replace(old,new,1)
              p.write_text(text[:a]+block+text[b:],encoding='utf-8')

          server='web/direct_upload_server.py'
          replace_once(server,
              'TIKTOK_SCOPE="user.info.basic,video.publish,video.list"',
              'TIKTOK_SCOPE="user.info.basic,video.publish"')
          replace_once(server,
              'if not {"user.info.basic","video.publish","video.list"}<=granted:raise ValueError("Required permissions were not granted")',
              'if not {"user.info.basic","video.publish"}<=granted:raise ValueError("Required permissions were not granted")')
          replace_once(server,
              '''def _redirect(handler,url):
              handler.send_response(302)
              handler.send_header("Location",str(url))
              handler.send_header("Cache-Control","no-store")
              handler.end_headers()''',
              '''def _redirect(handler,url):
              target=str(url)
              if target=="/?gsf_hub=social":target += "&oauth_return="+str(int(time.time()*1000))
              handler.send_response(302)
              handler.send_header("Location",target)
              handler.send_header("Cache-Control","no-store, max-age=0")
              if target.startswith("/?gsf_hub=social"):handler.send_header("Pragma","no-cache")
              handler.end_headers()''')

          for old,new in (
              ('"youtube":bool(youtube_state)', '"youtube":bool(social_snapshot.get("youtube"))'),
              ('"tiktok":bool(tiktok_state)', '"tiktok":bool(social_snapshot.get("tiktok"))'),
              ('"instagram":bool(instagram_state)', '"instagram":bool(social_snapshot.get("instagram"))'),
              ('"facebook":bool(providers.get("facebook"))', '"facebook":bool(social_snapshot.get("facebook"))'),
              ('"twitch":bool(providers.get("twitch"))', '"twitch":bool(social_snapshot.get("twitch"))'),
          ):
              replace_in_block(server, 'if clean=="/creator-hub/state":', 'if clean=="/account":', old, new)

          hub='web/creator_hub_v156_component/index.html'
          replace_once(hub,
              'let current="dashboard", projectPane="drafts";',
              'let current="dashboard", projectPane="drafts";\nlet oauthNavigating=false;')
          replace_in_block(hub, 'function connectSocial(key){', '// Profile:',
              'if(key==="youtube")top.location.href="/social-connect/youtube/start";',
              'oauthNavigating=true;\n  if(key==="youtube")top.location.href="/social-connect/youtube/start";')
          replace_in_block(hub, 'async function loadState(){', 'function csrfHeaders',
              'reportHubError("loadState",e);',
              'if(oauthNavigating||document.visibilityState==="hidden")return null;\n    reportHubError("loadState",e);')
          replace_once(hub,
              'window.addEventListener("pageshow",repairFrame);',
              'window.addEventListener("pageshow",()=>{oauthNavigating=false;repairFrame();loadState()});')

          start=Path('web/start_web.sh')
          st=start.read_text(encoding='utf-8')
          old='python /app/web/direct_upload_server_v423.py &'
          if old not in st:raise SystemExit('temporary V423 startup entrypoint missing')
          st=st.replace(old,'python /app/web/direct_upload_server.py &',1)
          st=st.replace('# V423 keeps the stable upload server as the implementation module and applies\n# only the production-verified OAuth compatibility layer at the entrypoint.\n','')
          start.write_text(st,encoding='utf-8')
          Path('web/direct_upload_server_v423.py').unlink(missing_ok=True)

          social=Path('tests/test_social_oauth_v421.py')
          text=social.read_text(encoding='utf-8')
          text=text.replace('user.info.basic,video.publish,video.list','user.info.basic,video.publish')
          social.write_text(text,encoding='utf-8')

          Path('tests/test_oauth_return_regressions_v423.py').write_text('''import re\nimport unittest\nfrom pathlib import Path\n\nROOT=Path(__file__).resolve().parents[1]\nSERVER=(ROOT/"web/direct_upload_server.py").read_text(encoding="utf-8")\nHUB=(ROOT/"web/creator_hub_v156_component/index.html").read_text(encoding="utf-8")\n\nclass OAuthReturnRegressionContracts(unittest.TestCase):\n    def test_tiktok_direct_post_scope_is_minimal(self):\n        m=re.search(r\'^TIKTOK_SCOPE="([^"]+)"\',SERVER,re.M)\n        self.assertIsNotNone(m)\n        scopes=set(m.group(1).split(','))\n        self.assertIn('user.info.basic',scopes)\n        self.assertIn('video.publish',scopes)\n        self.assertNotIn('video.list',scopes)\n        cb=SERVER[SERVER.index('def _tiktok_oauth_callback'):SERVER.index('def _tiktok_disconnect')]\n        self.assertNotIn('"video.list"}<=granted',cb)\n\n    def test_twitch_state_uses_authoritative_social_snapshot(self):\n        block=SERVER[SERVER.index('if clean=="/creator-hub/state":'):SERVER.index('if clean=="/account":')]\n        self.assertIn('"twitch":bool(social_snapshot.get("twitch"))',block)\n        self.assertNotIn('"twitch":bool(providers.get("twitch"))',block)\n\n    def test_oauth_return_is_fresh_and_no_store(self):\n        block=SERVER[SERVER.index('def _redirect'):SERVER.index('def _html')]\n        self.assertIn('oauth_return=',block)\n        self.assertIn('no-store, max-age=0',block)\n        self.assertIn('Pragma',block)\n\n    def test_hub_suppresses_transient_navigation_failure(self):\n        self.assertIn('oauthNavigating=true',HUB.replace(' ',''))\n        self.assertIn('oauthNavigating||document.visibilityState==="hidden"',HUB)\n        self.assertIn('pageshow",()=>{oauthNavigating=false;repairFrame();loadState()}',HUB)\n\nif __name__=='__main__':unittest.main()\n''',encoding='utf-8')

          workflow=Path('.github/workflows/gsf-ci.yml')
          w=workflow.read_text(encoding='utf-8')
          marker='\n  oauth-hotfix:\n'
          if marker not in w:raise SystemExit('temporary OAuth hotfix job marker missing')
          workflow.write_text(w.split(marker,1)[0].rstrip()+"\n",encoding='utf-8')
          PY

      - name: Verify focused contracts before push
        run: |
          python tests/test_oauth_return_regressions_v423.py
          python tests/test_canonical_ui_pipeline.py
          python -m compileall -q web/direct_upload_server.py tests/test_oauth_return_regressions_v423.py

      - name: Commit canonical hotfix
        run: |
          git config user.name "GSF Coordinator"
          git config user.email "gsf-coordinator@users.noreply.github.com"
          git add .github/workflows/gsf-ci.yml web/direct_upload_server.py web/creator_hub_v156_component/index.html web/start_web.sh tests/test_social_oauth_v421.py tests/test_oauth_return_regressions_v423.py
          git add -u web/direct_upload_server_v423.py
          git commit -m "fix: stabilize canonical social OAuth return flow"
          git push origin HEAD:chat/complete-existing-social-oauth-meta-tiktok-twitc-eb5961
