name: V428 CTA cleanup once

on:
  push:
    branches:
      - chat/mobile-polish-user-notes-20261023
    paths:
      - '.github/workflows/v428-cta-cleanup-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Apply cleanup
        run: python tools/apply_v428_cta_semantics.py
      - name: Verify targeted regressions
        run: python -m pytest -q tests/test_mobile_polish_v428.py
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'GSF Coordinator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/ai_v221_component/index.html tests/test_mobile_polish_v428.py
          git diff --cached --check
          git commit -m 'fix: keep create short separate from publish'
          git push origin HEAD:chat/mobile-polish-user-notes-20261023
