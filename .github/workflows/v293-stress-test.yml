name: V293 Safe Production Stress Test

on:
  push:
    branches:
      - stress-test-2026-10-06

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run staged HTTP stress test
        env:
          BASE_URL: https://gaming-shorts-factory-v79-production.up.railway.app
        run: |
          python - <<'PY'
          import concurrent.futures, json, math, os, statistics, time, urllib.request, urllib.error
          from collections import Counter

          base=os.environ['BASE_URL'].rstrip('/')
          stages=[
              ('warmup-root','/',10,1),
              ('root-c5','/',20,5),
              ('root-c10','/',40,10),
              ('root-c20','/',80,20),
              ('root-c40','/',120,40),
              ('share-state-c20','/share/state',100,20),
              ('hub-state-c20','/hub/state',100,20),
          ]

          def one(path):
              url=base+path
              req=urllib.request.Request(url,headers={'User-Agent':'GSF-V293-Stress/1.0','Cache-Control':'no-cache'})
              t0=time.perf_counter()
              try:
                  with urllib.request.urlopen(req,timeout=12) as r:
                      data=r.read(256)
                      return r.status,(time.perf_counter()-t0)*1000,None,len(data)
              except urllib.error.HTTPError as e:
                  try: e.read(64)
                  except Exception: pass
                  return e.code,(time.perf_counter()-t0)*1000,None,0
              except Exception as e:
                  return 0,(time.perf_counter()-t0)*1000,type(e).__name__,0

          def pct(xs,p):
              if not xs: return None
              ys=sorted(xs)
              k=max(0,min(len(ys)-1,math.ceil(p*len(ys))-1))
              return ys[k]

          results=[]
          fatal=False
          for name,path,total,conc in stages:
              started=time.perf_counter()
              rows=[]
              with concurrent.futures.ThreadPoolExecutor(max_workers=conc) as ex:
                  futs=[ex.submit(one,path) for _ in range(total)]
                  for f in concurrent.futures.as_completed(futs):
                      rows.append(f.result())
              elapsed=time.perf_counter()-started
              statuses=Counter(r[0] for r in rows)
              lat=[r[1] for r in rows]
              transport=sum(1 for r in rows if r[2])
              server5=sum(v for k,v in statuses.items() if 500 <= k <= 599)
              ok2=sum(v for k,v in statuses.items() if 200 <= k <= 299)
              row={
                  'stage':name,'path':path,'requests':total,'concurrency':conc,
                  'elapsed_s':round(elapsed,3),'rps':round(total/max(elapsed,0.001),2),
                  '2xx':ok2,'5xx':server5,'transport_errors':transport,
                  'status_counts':dict(sorted(statuses.items())),
                  'p50_ms':round(pct(lat,.50),1),'p95_ms':round(pct(lat,.95),1),'p99_ms':round(pct(lat,.99),1),
                  'max_ms':round(max(lat),1),
              }
              results.append(row)
              print(json.dumps(row,sort_keys=True))
              # Stop escalating if production starts failing materially.
              if server5/total > 0.02 or transport/total > 0.02:
                  print(f'SAFETY_STOP: {name} exceeded 2% server/transport error budget')
                  fatal=True
                  break
              time.sleep(3)

          print('V293_SUMMARY='+json.dumps(results,separators=(',',':')))
          if fatal:
              raise SystemExit(2)
          print('V293 STRESS TEST: PASS')
          PY
