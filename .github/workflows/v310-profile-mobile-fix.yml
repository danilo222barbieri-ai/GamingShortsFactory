name: V310 Profile mobile fix

on:
  push:
    branches:
      - v310-profile-mobile-fix
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Run V310 contract
        run: |
          python -m py_compile web/fix_v310_profile_mobile.py web/test_v310_profile_overview_preserved.py
          python web/test_v310_profile_overview_preserved.py .

      - name: Build production image
        run: docker build --progress=plain -t gsf-v310 .

      - name: Start production image
        run: |
          docker run -d --name gsf-v310-run -p 8080:8080 \
            -e PORT=8080 -e GSF_WEB_MODE=1 gsf-v310

      - name: Wait for healthy startup
        run: |
          set -eu
          for i in $(seq 1 90); do
            if ! docker inspect -f '{{.State.Running}}' gsf-v310-run 2>/dev/null | grep -q true; then
              echo 'Container exited before becoming healthy'
              docker logs gsf-v310-run || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo 'V310 production container: HEALTHY'
              docker logs gsf-v310-run | tail -n 240
              exit 0
            fi
            sleep 2
          done
          echo 'Timed out waiting for V310 container'
          docker logs gsf-v310-run || true
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker logs gsf-v310-run || true
