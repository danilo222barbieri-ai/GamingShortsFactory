name: V410 Security Gate

on:
  push:
    branches:
      - v410-security-hardening
    paths:
      - 'web/fix_v410_security_hardening.py'
      - 'web/test_v410_security_hardening.py'
      - 'web/direct_upload_server.py'
      - 'web/nginx.conf.template'
      - 'web/start_web.sh'
      - 'requirements-web.txt'
      - 'constraints-web.txt'
      - '.github/workflows/v410-security-gate.yml'
  pull_request:
    branches:
      - main

jobs:
  security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: V410 security contract
        run: python web/test_v410_security_hardening.py .
      - name: Install security scanners
        run: python -m pip install --disable-pip-version-check pip-audit bandit
      - name: Dependency audit
        run: pip-audit -r requirements-web.txt -c constraints-web.txt
      - name: Source security scan
        run: bandit -q -r web -x web/test_*,tests -lll
