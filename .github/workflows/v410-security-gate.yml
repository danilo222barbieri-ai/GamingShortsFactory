name: V410 Security Gate

on:
  push:
    branches:
      - v410-security-hardening
    paths:
      - 'web/fix_v410_security_hardening.py'
      - 'web/fix_v410_1_edge_identity.py'
      - 'web/test_v410_security_hardening.py'
      - 'web/test_v105_dependency_lock.py'
      - 'web/start_secure.sh'
      - 'web/direct_upload_server.py'
      - 'web/nginx.conf.template'
      - 'web/content_memory_v145.py'
      - 'web/editor_2027_embed.py'
      - 'requirements-web.txt'
      - 'constraints-web.txt'
      - '.github/workflows/v410-security-gate.yml'
  pull_request:
    branches:
      - main

jobs:
  security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V410 hardening
        run: |
          python web/fix_v410_security_hardening.py .
          python web/fix_v410_1_edge_identity.py .
      - name: Verify patch idempotence
        run: |
          python web/fix_v410_security_hardening.py .
          python web/fix_v410_1_edge_identity.py .
      - name: Compile protected server
        run: python -m py_compile web/direct_upload_server.py web/fix_v410_security_hardening.py web/fix_v410_1_edge_identity.py web/test_v410_security_hardening.py web/test_v105_dependency_lock.py web/content_memory_v145.py web/editor_2027_embed.py
      - name: V410 security contract
        run: python web/test_v410_security_hardening.py .
      - name: Verify production dependency lock resolves
        run: python -m pip install --disable-pip-version-check --dry-run -r requirements-web.txt -c constraints-web.txt
      - name: Dependency audit with pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-web.txt
      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit
      - name: Source security scan
        run: bandit -q -r web -x 'web/test_*,tests' -lll
      - name: Build full production image
        run: |
          set -o pipefail
          if docker build --progress=plain -t gsf-v410-secure:${{ github.sha }} . 2>&1 | tee /tmp/gsf-v410-build.log; then
            exit 0
          fi
          if grep -Eq '429 Too Many Requests|Data limit exceeded' /tmp/gsf-v410-build.log \
             && grep -q 'public.ecr.aws/docker/library/python' /tmp/gsf-v410-build.log; then
            echo 'V410 Gate: ECR Python mirror rate-limited; retrying identical official Python base via Docker Hub'
            cp Dockerfile /tmp/Dockerfile.v410-gate
            sed -i '1s#^FROM public.ecr.aws/docker/library/python:3.12-slim$#FROM python:3.12-slim#' /tmp/Dockerfile.v410-gate
            test "$(head -n 1 /tmp/Dockerfile.v410-gate)" = 'FROM python:3.12-slim'
            docker build --progress=plain -f /tmp/Dockerfile.v410-gate -t gsf-v410-secure:${{ github.sha }} .
          else
            echo 'V410 Gate: image failed for a non-ECR-rate-limit reason; refusing fallback'
            exit 1
          fi
      - name: Boot secure production entrypoint
        run: |
          docker run -d --name gsf-v410-secure \
            -e PORT=8080 \
            -e GSF_WEB_MODE=1 \
            -e GSF_LOW_MEMORY_WEB=1 \
            -e GSF_DATA_ENCRYPTION_KEY=v410-ci-only-key \
            -e GSF_CSRF_SECRET=v410-ci-only-csrf \
            -p 18081:8080 \
            gsf-v410-secure:${{ github.sha }} \
            sh /app/web/start_secure.sh
      - name: Verify secure runtime health
        run: |
          set -eu
          for i in $(seq 1 120); do
            code=$(curl -sS -o /tmp/v410-health.json -w '%{http_code}' http://127.0.0.1:18081/healthz || true)
            if [ "$code" = "200" ]; then
              python - <<'PY'
          import json
          p=json.load(open('/tmp/v410-health.json',encoding='utf-8'))
          assert p.get('ok') is True, p
          assert p.get('companion') is True, p
          assert p.get('streamlit') is True, p
          print('V410 secure runtime health: PASS',p)
          PY
              exit 0
            fi
            sleep 2
          done
          docker logs gsf-v410-secure || true
          exit 1
      - name: Verify secure runtime markers
        run: |
          logs=$(docker logs gsf-v410-secure 2>&1)
          printf '%s\n' "$logs" | grep -q 'V410 security hardening applied'
          printf '%s\n' "$logs" | grep -q 'V410.1 proxy-aware edge hardening applied'
          printf '%s\n' "$logs" | grep -q 'V410 security hardening contract: PASS'
      - name: Cleanup secure runtime
        if: always()
        run: docker rm -f gsf-v410-secure || true
