name: V410 Security Gate

on:
  push:
    branches:
      - v410-security-hardening
    paths:
      - 'web/fix_v410_security_hardening.py'
      - 'web/fix_v410_1_edge_identity.py'
      - 'web/test_v410_security_hardening.py'
      - 'web/test_v105_dependency_lock.py'
      - 'web/start_secure.sh'
      - 'web/direct_upload_server.py'
      - 'web/nginx.conf.template'
      - 'web/content_memory_v145.py'
      - 'web/editor_2027_embed.py'
      - 'requirements-web.txt'
      - 'constraints-web.txt'
      - '.github/workflows/v410-security-gate.yml'
  pull_request:
    branches:
      - main

jobs:
  security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V410 hardening
        run: |
          python web/fix_v410_security_hardening.py .
          python web/fix_v410_1_edge_identity.py .
      - name: Verify patch idempotence
        run: |
          python web/fix_v410_security_hardening.py .
          python web/fix_v410_1_edge_identity.py .
      - name: Compile protected server
        run: python -m py_compile web/direct_upload_server.py web/fix_v410_security_hardening.py web/fix_v410_1_edge_identity.py web/test_v410_security_hardening.py web/test_v105_dependency_lock.py web/content_memory_v145.py web/editor_2027_embed.py
      - name: V410 security contract
        run: python web/test_v410_security_hardening.py .
      - name: Verify production dependency lock resolves
        run: python -m pip install --disable-pip-version-check --dry-run -r requirements-web.txt -c constraints-web.txt
      - name: Dependency audit with pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-web.txt
      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit
      - name: Source security scan
        run: bandit -q -r web -x 'web/test_*,tests' -lll
