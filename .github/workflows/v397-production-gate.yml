name: GSF Production Gate

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.railway/frontend-deploy.txt'
      - '.railway/worker-deploy.txt'
      - '.gsf/**'
      - 'PROJECT_STATUS.md'
      - 'AGENTS.md'
      - 'docs/superpowers/**'
      - 'docs/runbooks/**'
  pull_request:
    branches:
      - main
    # Docker build + runtime smoke only when something that ships in the image changes.
    paths:
      - 'Dockerfile'
      - 'app.py'
      - 'web/**'
      - 'gsf_core/**'
      - 'gsf_*.py'
      - '.streamlit/**'
      - 'requirements-web.txt'
      - 'constraints-web.txt'
      - 'tools/gsf_ui_manifest.py'
      - 'tests/test_canonical_ui_pipeline.py'
      - 'tests/test_gate_promotion_reliability.py'
      - 'tests/test_gate_health.py'
      - 'tools/gsf_gate_health.py'
      - '.github/workflows/v397-production-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gsf-production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Canonical UI pipeline guard
        run: python tests/test_canonical_ui_pipeline.py

      - name: Promotion diff contract
        run: |
          python tests/test_gate_promotion_diff.py
          python tests/test_gate_promotion_reliability.py
          python tests/test_gate_health.py
          python -m unittest discover -s tests -p test_render_gate_reliability.py

      - name: Mobile Game Editor JavaScript contracts
        run: |
          node --test tests/js/mobile_game_editor_state.test.mjs
          node --check web/game_editor_mobile_component/editor.mjs
          node --check web/game_editor_mobile_component/editor_state.mjs

      - name: V397 structural production contract
        run: |
          python web/test_v397_production_hardening.py .
          python -m py_compile web/direct_upload_server.py web/runtime_smoke_v107.py

      - name: V398 semantic resilience contract
        env:
          PYTHONPATH: web
        run: |
          python - <<'PY'
          from semantic_video_v114 import is_retryable_provider_error
          retryable = (
              "503 UNAVAILABLE model high demand",
              "Gemini Generate Content video response empty",
              "Expecting value: line 1 column 1 (char 0)",
              "ReadTimeout timed out",
          )
          for message in retryable:
              assert is_retryable_provider_error(message), message
          assert not is_retryable_provider_error("400 INVALID_ARGUMENT malformed request")
          print("V398 transient-provider classifier: PASS")
          PY
          python - <<'PY'
          from pathlib import Path
          semantic=Path("web/semantic_video_v114.py").read_text(encoding="utf-8")
          assert 'http_options=types.HttpOptions(timeout=' in semantic
          print("V398 static Generate Content timeout: PASS")
          PY

      - name: V399 quality contract
        env:
          PYTHONPATH: web
        run: python web/test_v399_quality_supreme.py

      - name: V400 AI + Hi-DPI contract
        env:
          PYTHONPATH: web
        run: python web/test_v400_ai_hidpi.py

      - name: V401 performance and stability contract
        env:
          PYTHONPATH: web
        run: python web/test_v401_performance_stability.py

      - name: V402 Game Brain / Auto Highlights contract
        env:
          PYTHONPATH: web
        run: python web/test_v402_game_brain_auto_highlights.py

      - name: Current Python syntax guard
        run: |
          python -m py_compile \
            web/quality_supreme_v399.py \
            web/director_render_exec_v143.py \
            web/privacy_cleanup_v149.py \
            web/ai_hidpi_v400.py \
            web/editor_2027_embed.py \
            web/job_state_v401.py \
            web/fix_v401_frontend_memory.py \
            web/fix_v401_worker_state.py \
            web/ai_worker_server.py \
            web/apply_v343_v293_compat.py \
            web/highlight_fusion_v402.py \
            web/auto_highlights/engine_v129.py \
            web/game_brain_v112.py

      - name: OAuth session, signature and isolation contracts
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check cryptography==50.0.1
          python -m unittest discover -s tests -p test_social_oauth_v421.py

      - name: Build worker image
        timeout-minutes: 15
        run: docker build --progress=plain -f web/Dockerfile.worker -t gsf-worker-gate:${{ github.sha }} .

      - name: Build production frontend image
        timeout-minutes: 20
        run: |
          set -o pipefail
          if docker build --progress=plain -t gsf-production-gate:${{ github.sha }} . 2>&1 | tee /tmp/gsf-production-build.log; then
            exit 0
          fi
          if grep -Eq '429 Too Many Requests|Data limit exceeded' /tmp/gsf-production-build.log \
             && grep -q 'public.ecr.aws/docker/library/python' /tmp/gsf-production-build.log; then
            echo 'Production Gate: ECR Python mirror rate-limited; retrying the same official Python base via Docker Hub'
            cp Dockerfile /tmp/Dockerfile.production-gate
            sed -i '1s#^FROM public.ecr.aws/docker/library/python:3.12-slim$#FROM python:3.12-slim#' /tmp/Dockerfile.production-gate
            test "$(head -n 1 /tmp/Dockerfile.production-gate)" = 'FROM python:3.12-slim'
            docker build --progress=plain -f /tmp/Dockerfile.production-gate -t gsf-production-gate:${{ github.sha }} .
          else
            echo 'Production Gate: frontend image failed for a non-ECR-rate-limit reason; refusing fallback'
            exit 1
          fi

      - name: Start production frontend image
        run: |
          docker run -d --name gsf-production-gate \
            -e PORT=8080 \
            -e GSF_WEB_MODE=1 \
            -e GSF_LOW_MEMORY_WEB=1 \
            -e GSF_DATA_ENCRYPTION_KEY=v411-ci-only-key \
            -e GSF_CSRF_SECRET=v411-ci-only-csrf \
            -p 18080:8080 \
            gsf-production-gate:${{ github.sha }}

      - name: Wait for composite health
        timeout-minutes: 4
        run: python tools/gsf_gate_health.py http://127.0.0.1:18080/healthz --container gsf-production-gate --deadline 180

      - name: Blocking runtime smoke
        timeout-minutes: 3
        run: docker exec gsf-production-gate python /app/web/runtime_smoke_v107.py

      - name: Image serves exactly the repository UI
        run: |
          set -euo pipefail
          docker cp gsf-production-gate:/app/.gsf-ui-manifest.json /tmp/gsf-ui-manifest.json
          python tools/gsf_ui_manifest.py compare --repo . --image-json /tmp/gsf-ui-manifest.json
          repo_digest=$(python tools/gsf_ui_manifest.py digest --repo .)
          served_digest=$(curl --connect-timeout 3 --max-time 15 -sS http://127.0.0.1:18080/healthz | python -c 'import json,sys;print(json.load(sys.stdin).get("ui_digest",""))')
          test "$repo_digest" = "$served_digest" || { echo "::error title=Canonical UI::healthz digest $served_digest != repo $repo_digest"; exit 1; }
          for page in creator_hub_v156_component:/creator-hub-v156/ ai_v221_component:/ai-v221/ game_editor_mobile_component:/game-editor-mobile/ editor_2027_component:/editor-live/ share_v156_component:/share-v156/; do
            dir=${page%%:*}; url=${page#*:}
            curl --connect-timeout 3 --max-time 15 -sS -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 19_0 like Mac OS X) Mobile/15E148 Safari/605.1' -o /tmp/served.html "http://127.0.0.1:18080$url"
            cmp -s /tmp/served.html "web/$dir/index.html" || { echo "::error title=Canonical UI::$url served bytes differ from web/$dir/index.html"; exit 1; }
            echo "served $url == web/$dir/index.html"
          done
          for asset in editor.css editor.mjs editor_state.mjs; do
            curl --connect-timeout 3 --max-time 15 -sS -o "/tmp/$asset" "http://127.0.0.1:18080/game-editor-mobile/$asset"
            cmp -s "/tmp/$asset" "web/game_editor_mobile_component/$asset" || { echo "::error title=Canonical UI::mobile editor $asset served bytes differ"; exit 1; }
          done
          echo "::notice title=Canonical UI::image == repo, digest $repo_digest"

      - name: Essential UI and security runtime
        timeout-minutes: 3
        run: |
          docker exec gsf-production-gate python /app/web/runtime_smoke_v411.py
          GSF_BASE_URL=http://127.0.0.1:18080 python -m unittest discover -s tests -p test_closed_beta_routes.py
          GSF_BASE_URL=http://127.0.0.1:18080 python -m unittest discover -s tests -p test_social_oauth_v421.py
          # the running container must not have rewritten any canonical file
          docker exec gsf-production-gate python /app/gsf_ui_manifest.py verify

      - name: Mobile WebKit interaction gate
        timeout-minutes: 25
        env:
          BASE: http://127.0.0.1:18080
          CYCLES: '2'
          # Keep every route sequence and leak assertion; full stress defaults
          # to ten cycles outside the blocking per-patch production gate.
          GSF_NAV_CYCLES: '3'
          OUT_DIR: /tmp/gsf-mobile-webkit
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps webkit
          python tests/visual/gsf_visual_check.py
          GSF_BROWSER=webkit python -m unittest discover -s tests -p test_closed_beta_bugfix_pass.py
          GSF_BROWSER=webkit python -m unittest discover -s tests -p test_alive_continuity_v424.py
          GSF_BROWSER=webkit python -m unittest discover -s tests -p test_social_oauth_v421.py
          GSF_BROWSER=webkit python -m unittest discover -s tests -p test_source_library_v422.py
          GSF_BROWSER=webkit python -m unittest discover -s tests -p test_ai_failure_recovery_v425.py
          GSF_BROWSER=webkit python -m unittest discover -s tests -p test_publish_recovery_v426.py

      - name: Upload mobile WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsf-mobile-webkit-${{ github.sha }}
          path: /tmp/gsf-mobile-webkit
          if-no-files-found: warn
          retention-days: 7

      - name: Promote tested commit to Railway
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A claim/status update must not silently discard a passing runtime gate.
          # Only these non-runtime paths may advance while we test; anything else
          # waits for its own gate. Always base the marker commit on fresh main.
          safe_tail() {
            git merge-base --is-ancestor "$TESTED_SHA" "$1" || return 1
            while IFS= read -r path; do
              case "$path" in
                .gsf/*|PROJECT_STATUS.md|AGENTS.md|docs/superpowers/*|docs/runbooks/*|.railway/frontend-deploy.txt|.railway/worker-deploy.txt) ;;
                *) echo "Untested change: $path" >&2; return 1 ;;
              esac
            done < <(git diff --name-only "$TESTED_SHA" "$1")
          }
          git fetch --no-tags origin main
          remote_sha=$(git rev-parse origin/main)
          if ! safe_tail "$remote_sha"; then
            echo "::notice::A newer runtime commit exists; its own gate must promote it."
            exit 0
          fi
          git checkout --detach "$remote_sha"

          before="$BEFORE_SHA"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="${TESTED_SHA}^"
          fi

          # Diff each service against the commit it currently runs (its marker),
          # not only against the previous push: a push that touches no runtime
          # file must still promote runtime commits that were never promoted
          # (e.g. a merge whose gate run was skipped).
          valid_marker_commit() {
            printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$' \
              && git cat-file -e "${1}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$1" "$TESTED_SHA"
          }
          base_for() {
            local marker_path="$1" marker marker_commit
            marker=$(git show "HEAD:$marker_path" 2>/dev/null | tr -d '[:space:]' || true)
            if valid_marker_commit "$marker"; then
              echo "$marker"
              return
            fi
            # Manual/non-SHA or deleted markers must not hide an earlier
            # runtime merge whose gate failed. Recover the last valid marker.
            while IFS= read -r marker_commit; do
              marker=$(git show "${marker_commit}:${marker_path}" 2>/dev/null | tr -d '[:space:]' || true)
              if valid_marker_commit "$marker"; then
                echo "$marker"
                return
              fi
            done < <(git log --format=%H -- "$marker_path")
            # No trusted deployment history: conservatively diff the whole tree.
            git hash-object -w -t tree --stdin < /dev/null
          }
          frontend_base=$(base_for .railway/frontend-deploy.txt)
          worker_base=$(base_for .railway/worker-deploy.txt)
          git diff --name-only "$frontend_base" "$TESTED_SHA" > /tmp/gsf-frontend-files.txt
          git diff --name-only "$worker_base" "$TESTED_SHA" > /tmp/gsf-worker-files.txt
          echo "Frontend files since ${frontend_base::12}:"
          cat /tmp/gsf-frontend-files.txt
          echo "Worker files since ${worker_base::12}:"
          cat /tmp/gsf-worker-files.txt

          frontend=0
          worker=0
          while IFS= read -r path; do
            case "$path" in
              Dockerfile|app.py|requirements-web.txt|constraints-web.txt|.streamlit/*|src_payload/*|web/*|gsf_core/*|gsf_alive.py|gsf_alive_notifications.py|gsf_editor_v403.py|gsf_project_state.py|tools/gsf_ui_manifest.py|.github/workflows/v397-production-gate.yml)
                frontend=1
                ;;
            esac
          done < /tmp/gsf-frontend-files.txt
          while IFS= read -r path; do
            case "$path" in
              src_payload/*|web/Dockerfile.worker|web/requirements-worker.txt|web/ai_worker_server.py|web/ffmpeg_lowmem.py|web/gsf_bucket_bridge.py|web/semantic_video_v114.py|web/test_v114_semantic_video.py|web/ai_director_v124.py|web/quality_control_v124.py|web/guardian_intelligence_v124.py|web/test_v124_ai_core.py|web/job_state_v401.py|web/fix_v401_worker_state.py|web/highlight_fusion_v402.py|web/auto_highlights/*|web/game_brain_v112.py|web/quality_supreme_v399.py|web/director_render_exec_v143.py|web/render_gate_v293.py|web/privacy_cleanup_v149.py|web/apply_v7*.py|web/apply_v8*.py|web/apply_v9*.py)
                worker=1
                ;;
            esac
          done < /tmp/gsf-worker-files.txt

          if [ "$frontend" -eq 0 ] && [ "$worker" -eq 0 ]; then
            echo 'No Railway runtime files changed; no deployment marker needed.'
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p .railway

          if [ "$frontend" -eq 1 ]; then
            printf '%s\n' "$TESTED_SHA" > .railway/frontend-deploy.txt
            git add .railway/frontend-deploy.txt
          fi
          if [ "$worker" -eq 1 ]; then
            printf '%s\n' "$TESTED_SHA" > .railway/worker-deploy.txt
            git add .railway/worker-deploy.txt
          fi

          if git diff --cached --quiet; then
            echo 'Deployment marker already points at this tested commit.'
            exit 0
          fi

          git commit -m "deploy: promote tested ${TESTED_SHA::12} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch --no-tags origin main
            remote_sha=$(git rev-parse origin/main)
            if ! safe_tail "$remote_sha"; then
              echo "::notice::Runtime advanced during promotion; leaving deployment to its gate."
              exit 0
            fi
            # Rebase preserves concurrent coordination writes. Conflicts fail
            # closed; never force-push or overwrite another gate's markers.
            git rebase "$remote_sha"
          done
          echo '::error::Promotion push failed after three bounded attempts.'
          exit 1

      - name: Capture structural diagnostics
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/gsf-production-diagnostics
          cp /tmp/gsf-production-build.log /tmp/gsf-production-diagnostics/frontend-build.log 2>/dev/null || true
          docker ps -a > /tmp/gsf-production-diagnostics/docker-ps.txt 2>&1
          docker inspect gsf-production-gate > /tmp/gsf-production-diagnostics/docker-inspect.json 2>&1
          docker top gsf-production-gate > /tmp/gsf-production-diagnostics/docker-top.txt 2>&1
          docker logs --timestamps gsf-production-gate > /tmp/gsf-production-diagnostics/docker.log 2>&1
          cp /tmp/gsf-production-health.json /tmp/gsf-production-diagnostics/last-health.json 2>/dev/null || true
          if [ "$(docker inspect -f '{{.State.Running}}' gsf-production-gate 2>/dev/null)" = "true" ]; then
            docker exec gsf-production-gate sh -lc 'cat /proc/net/tcp; echo ---TCP6---; cat /proc/net/tcp6' > /tmp/gsf-production-diagnostics/container-tcp.txt 2>&1 || true
            docker exec gsf-production-gate python -c 'import requests; urls=("http://127.0.0.1:8501/","http://127.0.0.1:8502/healthz","http://127.0.0.1:8080/healthz"); [(lambda u: print(u, requests.get(u, timeout=2).status_code, requests.get(u, timeout=2).text[:1000]))(u) for u in urls]' > /tmp/gsf-production-diagnostics/internal-health.txt 2>&1 || true
            docker cp gsf-production-gate:/tmp/gsf-runtime /tmp/gsf-production-diagnostics/runtime >/dev/null 2>&1 || true
          fi
          find /tmp/gsf-production-diagnostics -maxdepth 3 -type f -print -exec sh -c 'echo "--- $1 ---"; tail -n 120 "$1"' _ {} \; || true
          # Surface the decisive lines as annotations (readable via the API even when logs are not).
          for f in /tmp/gsf-production-diagnostics/frontend-build.log /tmp/gsf-production-diagnostics/docker.log; do
            [ -f "$f" ] || continue
            grep -nE 'Error|ERROR|FAIL|Traceback|AssertionError|exit code|missing|drift' "$f" | tail -n 8 | while IFS= read -r line; do
              printf '::error title=%s::%s\n' "$(basename "$f")" "$(printf '%s' "$line" | cut -c1-400 | tr -d '\r')"
            done
          done

      - name: Upload structural diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gsf-production-gate-diagnostics
          path: /tmp/gsf-production-diagnostics
          if-no-files-found: warn
          retention-days: 3

      - name: Container logs on failure
        if: failure()
        run: docker logs gsf-production-gate || true

      - name: Cleanup structural container
        if: always()
        run: docker rm -f gsf-production-gate || true
