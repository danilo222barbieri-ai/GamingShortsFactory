name: V397 Production Gate

on:
  push:
    branches:
      - main
      - v397-structural-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: v397-production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: V397 source contract
        run: |
          python web/test_v397_production_hardening.py .
          python -m py_compile web/direct_upload_server.py web/runtime_smoke_v107.py

      - name: Build production image
        run: |
          set -o pipefail
          if docker build --progress=plain -t gsf-v397:${{ github.sha }} . 2>&1 | tee /tmp/v397-build.log; then
            exit 0
          fi
          if grep -Eq '429 Too Many Requests|Data limit exceeded' /tmp/v397-build.log \
             && grep -q 'public.ecr.aws/docker/library/python' /tmp/v397-build.log; then
            echo 'V397: ECR Python mirror rate-limited; retrying the same official Python base via Docker Hub'
            cp Dockerfile /tmp/Dockerfile.v397
            sed -i '1s#^FROM public.ecr.aws/docker/library/python:3.12-slim$#FROM python:3.12-slim#' /tmp/Dockerfile.v397
            test "$(head -n 1 /tmp/Dockerfile.v397)" = 'FROM python:3.12-slim'
            docker build --progress=plain -f /tmp/Dockerfile.v397 -t gsf-v397:${{ github.sha }} .
          else
            echo 'V397: production image failed for a non-ECR-rate-limit reason; refusing fallback'
            exit 1
          fi

      - name: Start production image
        run: |
          docker run -d --name gsf-v397 \
            -e PORT=8080 \
            -e GSF_WEB_MODE=1 \
            -e GSF_LOW_MEMORY_WEB=1 \
            -p 18080:8080 \
            gsf-v397:${{ github.sha }}

      - name: Wait for composite health
        run: |
          set -eu
          for i in $(seq 1 120); do
            code=$(curl -sS -o /tmp/v397-health.json -w '%{http_code}' http://127.0.0.1:18080/healthz || true)
            if [ "$code" = "200" ]; then
              python - <<'PY'
          import json
          p=json.load(open('/tmp/v397-health.json',encoding='utf-8'))
          assert p.get('ok') is True, p
          assert p.get('companion') is True, p
          assert p.get('streamlit') is True, p
          print('V397 composite health: PASS',p)
          PY
              exit 0
            fi
            sleep 2
          done
          echo 'V397 composite health did not become ready'
          cat /tmp/v397-health.json 2>/dev/null || true
          exit 1

      - name: Blocking runtime smoke
        run: docker exec gsf-v397 python /app/web/runtime_smoke_v107.py

      - name: UI contract V343 global shell
        run: docker exec gsf-v397 python /app/web/test_v343_single_global_shell.py /app

      - name: UI contract V389 bounded reset
        run: docker exec gsf-v397 python /app/web/test_v389_mobile_editor_bounded_reset.py /app

      - name: UI contract V391 top actions
        run: docker exec gsf-v397 python /app/web/test_v391_mobile_editor_top_actions.py /app

      - name: UI contract V393 clean transport
        run: docker exec gsf-v397 python /app/web/test_v393_mobile_editor_clean_transport.py /app

      - name: UI contract V394 footer restore
        run: docker exec gsf-v397 python /app/web/test_v394_mobile_editor_footer_restore.py /app

      - name: UI contract V395 atomic skin
        run: docker exec gsf-v397 python /app/web/test_v395_mobile_editor_atomic_skin.py /app

      - name: UI contract V396 share publish surface
        run: docker exec gsf-v397 python /app/web/test_v396_mobile_share_publish_surface.py /app

      - name: Capture structural diagnostics
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/v397-diagnostics
          docker ps -a > /tmp/v397-diagnostics/docker-ps.txt 2>&1
          docker inspect gsf-v397 > /tmp/v397-diagnostics/docker-inspect.json 2>&1
          docker top gsf-v397 > /tmp/v397-diagnostics/docker-top.txt 2>&1
          docker logs --timestamps gsf-v397 > /tmp/v397-diagnostics/docker.log 2>&1
          cp /tmp/v397-health.json /tmp/v397-diagnostics/last-health.json 2>/dev/null || true
          if [ "$(docker inspect -f '{{.State.Running}}' gsf-v397 2>/dev/null)" = "true" ]; then
            docker exec gsf-v397 sh -lc 'cat /proc/net/tcp; echo ---TCP6---; cat /proc/net/tcp6' > /tmp/v397-diagnostics/container-tcp.txt 2>&1 || true
            docker exec gsf-v397 python -c 'import requests; urls=("http://127.0.0.1:8501/","http://127.0.0.1:8502/healthz","http://127.0.0.1:8080/healthz"); [(lambda u: print(u, requests.get(u, timeout=2).status_code, requests.get(u, timeout=2).text[:1000]))(u) for u in urls]' > /tmp/v397-diagnostics/internal-health.txt 2>&1 || true
            docker cp gsf-v397:/tmp/gsf-runtime /tmp/v397-diagnostics/runtime >/dev/null 2>&1 || true
          fi
          find /tmp/v397-diagnostics -maxdepth 3 -type f -print -exec sh -c 'echo "--- $1 ---"; tail -n 120 "$1"' _ {} \; || true

      - name: Upload structural diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v397-structural-diagnostics
          path: /tmp/v397-diagnostics
          if-no-files-found: warn
          retention-days: 3

      - name: Container logs on failure
        if: failure()
        run: docker logs gsf-v397 || true

      - name: Cleanup structural container
        if: always()
        run: docker rm -f gsf-v397 || true
