name: V404 Crea con IA Simple

on:
  push:
    branches:
      - chat/crea-con-ia-simple-3a72f1
    paths:
      - 'web/ai_v221_component/index.html'
      - 'web/test_v404_crea_con_ia_simple.py'
      - '.github/workflows/v404-crea-con-ia-simple.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/ai_v221_component/index.html'
      - 'web/test_v404_crea_con_ia_simple.py'
      - '.github/workflows/v404-crea-con-ia-simple.yml'

jobs:
  v404-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: V404 two-step UI contract
        run: python web/test_v404_crea_con_ia_simple.py
