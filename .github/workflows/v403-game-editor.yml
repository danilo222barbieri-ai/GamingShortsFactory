name: v403-game-editor

on:
  push:
    branches:
      - chat/game-editor-v403-021
    paths:
      - gsf_editor_v403.py
      - tests/test_game_editor_v403.py
      - scripts/apply_v403_game_editor.py
      - app.py
      - .github/workflows/v403-game-editor.yml
  pull_request:
    branches:
      - main
    paths:
      - gsf_editor_v403.py
      - tests/test_game_editor_v403.py
      - scripts/apply_v403_game_editor.py
      - app.py

jobs:
  test-editor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile editor support module
        run: python -m py_compile gsf_editor_v403.py
      - name: Run Game Editor V403 tests
        run: python -m unittest -v tests.test_game_editor_v403
      - name: Canonical app still compiles with the editor module
        run: |
          # Canonical UI pipeline: app.py is the production app and is never
          # patched by scripts. The old step applied scripts/apply_v403_game_editor.py
          # to a non-production app.py; V403 runtime integration, when it happens,
          # is a direct edit of the canonical files (see docs/architecture/gsf-canonical-ui.md).
          python -m py_compile app.py gsf_editor_v403.py
