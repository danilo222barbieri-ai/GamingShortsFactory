name: GSF Orchestration CI

on:
  push:
    branches:
      - chat/parallel-rollback-one-command
    paths:
      - 'tools/**'
      - '.gsf/**'
      - 'AGENTS.md'
      - 'PROJECT_STATUS.md'
      - 'docs/runbooks/**'
      - '.github/workflows/gsf-orchestration-ci.yml'
      - '.github/workflows/v397-production-gate.yml'

permissions:
  contents: read

jobs:
  orchestration-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run orchestration tests
        run: |
          set -e
          python -m unittest discover -s tools -p 'test_gsf_*.py'
          python web/test_v397_production_hardening.py .
