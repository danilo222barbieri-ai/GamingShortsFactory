name: GSF Orchestration CI

on:
  push:
    branches:
      - chat/parallel-rollback-one-command
    paths:
      - 'tools/**'
      - '.gsf/**'
      - 'AGENTS.md'
      - 'PROJECT_STATUS.md'
      - 'docs/runbooks/**'
      - '.github/workflows/gsf-orchestration-ci.yml'

permissions:
  contents: read

jobs:
  orchestration-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run orchestration tests
        run: |
          set -e
          for test in \
            tools/test_gsf_claims.py \
            tools/test_gsf_coordination_gate.py \
            tools/test_gsf_rollback_policy.py \
            tools/test_gsf_one_command_contract.py; do
            if [ -f "$test" ]; then
              python "$test"
            fi
          done
