name: V294 Production Video Stress

on:
  push:
    branches:
      - v294-video-stress-2026-10-06

permissions:
  contents: read

jobs:
  video_stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Generate real H264 AAC fixture
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=1280x720:rate=30" \
            -f lavfi -i "sine=frequency=880:sample_rate=48000" \
            -t 12 -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -shortest /tmp/gsf-v294.mp4
          ffprobe -v error -show_entries format=duration,size -of json /tmp/gsf-v294.mp4

      - name: Progressive production upload and AI-prescan stress
        env:
          BASE_URL: https://gaming-shorts-factory-v79-production.up.railway.app
        run: |
          python - <<'PY'
          import concurrent.futures, json, os, pathlib, time, uuid, urllib.request, urllib.error

          BASE=os.environ['BASE_URL'].rstrip('/')
          VIDEO=pathlib.Path('/tmp/gsf-v294.mp4').read_bytes()
          NAME='v294_stress_720p30.mp4'
          SIZE=len(VIDEO)

          def request_json(path,sid,payload=None,method='GET',timeout=30):
              data=None if payload is None else json.dumps(payload).encode('utf-8')
              headers={'User-Agent':'GSF-V294-Video-Stress/1.0','X-GSF-Session-ID':sid,'Cache-Control':'no-cache'}
              if data is not None: headers['Content-Type']='application/json'
              req=urllib.request.Request(BASE+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  raw=r.read()
                  return r.status,json.loads(raw.decode('utf-8')) if raw else {}

          def upload_one(stage,index):
              sid=f"v294s{stage}_{int(time.time())}_{uuid.uuid4().hex[:8]}"
              t0=time.perf_counter()
              status,init=request_json('/bucket/init',sid,{
                  'name':NAME,'size':SIZE,'type':'video/mp4'
              },'POST')
              if status!=200 or not init.get('ok'):
                  raise RuntimeError(f'init failed sid={sid} status={status} body={init}')
              parts=init.get('parts') or []
              if len(parts)!=1:
                  raise RuntimeError(f'unexpected part count {len(parts)} for {SIZE} bytes')

              put_req=urllib.request.Request(parts[0]['url'],data=VIDEO,method='PUT',headers={
                  'Content-Type':'video/mp4','Content-Length':str(SIZE),'User-Agent':'GSF-V294-Video-Stress/1.0'
              })
              up0=time.perf_counter()
              with urllib.request.urlopen(put_req,timeout=90) as r:
                  etag=(r.headers.get('ETag') or '').strip()
                  put_status=r.status
              upload_s=time.perf_counter()-up0
              if put_status not in (200,201) or not etag:
                  raise RuntimeError(f'part upload failed sid={sid} status={put_status} etag={etag!r}')

              status,complete=request_json('/bucket/complete',sid,{
                  'upload_id':init['upload_id'],
                  'multipart_id':init['multipart_id'],
                  'key':init['key'],
                  'analysis_key':init['analysis_key'],
                  'name':NAME,
                  'size':SIZE,
                  'parts':[{'PartNumber':1,'ETag':etag}],
              },'POST')
              if status!=202 or not complete.get('ok'):
                  raise RuntimeError(f'complete failed sid={sid} status={status} body={complete}')

              prep0=time.perf_counter(); last={}
              while time.perf_counter()-prep0 < 120:
                  s,last=request_json('/bucket/status?upload_id='+init['upload_id'],sid)
                  if s==200 and last.get('ready'):
                      break
                  if s>=500 or last.get('error'):
                      raise RuntimeError(f'materialize failed sid={sid} status={s} body={last}')
                  time.sleep(1)
              else:
                  raise RuntimeError(f'materialize timeout sid={sid} body={last}')

              total_s=time.perf_counter()-t0
              row={
                  'stage':stage,'index':index,'sid':sid,'upload_id':init['upload_id'],
                  'analysis_key':init['analysis_key'],'bytes':SIZE,
                  'upload_s':round(upload_s,3),'materialize_s':round(time.perf_counter()-prep0,3),
                  'total_s':round(total_s,3)
              }
              print('VIDEO_FLOW='+json.dumps(row,sort_keys=True),flush=True)
              return row

          all_rows=[]
          for n in (1,2,4,6):
              print(f'=== V294 STAGE {n} CONCURRENT VIDEOS ===',flush=True)
              started=time.perf_counter(); rows=[]; errors=[]
              with concurrent.futures.ThreadPoolExecutor(max_workers=n) as ex:
                  futs=[ex.submit(upload_one,n,i) for i in range(n)]
                  for f in concurrent.futures.as_completed(futs):
                      try: rows.append(f.result())
                      except Exception as exc:
                          errors.append(repr(exc)); print('VIDEO_ERROR='+repr(exc),flush=True)
              elapsed=time.perf_counter()-started
              summary={
                  'stage':n,'submitted':n,'completed':len(rows),'errors':len(errors),
                  'elapsed_s':round(elapsed,3),
                  'avg_total_s':round(sum(r['total_s'] for r in rows)/len(rows),3) if rows else None,
                  'max_total_s':max((r['total_s'] for r in rows),default=None),
              }
              print('VIDEO_STAGE='+json.dumps(summary,sort_keys=True),flush=True)
              if errors:
                  print('V294 SAFETY STOP: stage failed; higher concurrency will not run',flush=True)
                  raise SystemExit(2)
              all_rows.extend(rows)
              # Give the two AI worker replicas time to drain queued prescans before escalating.
              time.sleep(12)

          print('V294_ANALYSIS_KEYS='+json.dumps([r['analysis_key'] for r in all_rows]),flush=True)
          print('V294 PRODUCTION VIDEO UPLOAD/PRESCAN STRESS: PASS',flush=True)
          PY
