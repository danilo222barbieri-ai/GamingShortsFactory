name: V370 Hub runtime diagnostics

on:
  push:
    branches:
      - debug-v370-hub-runtime

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: V370 single navigation owner contract
        run: python web/test_v370_single_navigation_owner.py .
      - name: Diagnose decompressed shell and Hub bootstrap
        if: always()
        run: python web/diagnose_v370_creator_hub_runtime.py . || true
