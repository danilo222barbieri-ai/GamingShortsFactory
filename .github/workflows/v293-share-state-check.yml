name: V293 Share State Check

on:
  push:
    branches:
      - v293-share-state-fix

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime patch
        run: python web/fix_v293_share_state_resilience.py web/direct_upload_server.py
      - name: Run regression contract
        run: python web/test_v293_share_state_resilience.py web/direct_upload_server.py
      - name: Compile patched server
        run: python -m py_compile web/direct_upload_server.py
      - name: Verify startup hook
        run: |
          grep -F 'fix_v293_share_state_resilience.py' web/start_web.sh
          grep -F 'test_v293_share_state_resilience.py' web/start_web.sh
          echo 'V293 share state branch check: PASS'
