name: V290 Full Flow Audit

on:
  workflow_dispatch:
  push:
    branches:
      - v290-full-flow-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --progress=plain -t gsf-v290-audit .
      - name: Audit generated runtime
        run: |
          docker run --rm --entrypoint python gsf-v290-audit \
            /app/web/audit_v290_full_flow.py \
            /app/GamingShortsFactory_V154_STRUCTURAL_HOME.py \
            /app/web/share_v156_component/index.html \
            /app/web/direct_upload_server.py \
            /app/web/nginx.conf.template
      - name: Start production image
        run: docker run -d --name gsf-v290 -p 8080:8080 -e PORT=8080 -e GSF_WEB_MODE=1 gsf-v290-audit
      - name: HTTP and startup-gate smoke
        run: |
          set -eu
          for i in $(seq 1 90); do
            if ! docker inspect -f '{{.State.Running}}' gsf-v290 2>/dev/null | grep -q true; then
              docker logs gsf-v290 || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS 'http://127.0.0.1:8080/share-v156/?v=290' | grep -q 'Condividi o scarica'
          curl -fsS http://127.0.0.1:8080/social-connect | grep -q 'YouTube'
          docker logs gsf-v290 2>&1 | grep -q 'V290 SOCIAL PUBLISH BRIDGE: PASS'
          echo 'V290 HTTP + STARTUP SMOKE: PASS'
      - name: Logs on failure
        if: failure()
        run: docker logs gsf-v290 || true
