name: V369 Hub native input

on:
  push:
    branches:
      - v369-hub-native-input

jobs:
  native-input:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run Creator Hub input contracts
        run: |
          python -m py_compile web/fix_v368_creator_hub_touch_recovery.py web/test_v368_creator_hub_touch_recovery.py web/test_v369_creator_hub_native_input.py
          python web/test_v368_creator_hub_touch_recovery.py .
          python web/test_v369_creator_hub_native_input.py .
      - name: Build production image
        run: docker build --progress=plain -t gsf-v369 .
      - name: Start production image
        run: docker run -d --name gsf-v369-run -p 8080:8080 -e PORT=8080 -e GSF_WEB_MODE=1 gsf-v369
      - name: Verify served iPhone Hub runtime
        run: |
          set -eu
          MOBILE_UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/27.0.1 Mobile/15E148 Safari/604.1'
          ready=0
          for i in $(seq 1 120); do
            if ! docker inspect -f '{{.State.Running}}' gsf-v369-run 2>/dev/null | grep -q true; then
              docker logs gsf-v369-run || true
              exit 1
            fi
            curl -fsS -A "$MOBILE_UA" "http://127.0.0.1:8080/creator-hub-v156/?v=3691&probe=${i}" -o /tmp/hub.html 2>/dev/null || true
            if test -s /tmp/hub.html && grep -q 'V368_CREATOR_HUB_TOUCH_RECOVERY' /tmp/hub.html; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1 || { docker logs gsf-v369-run || true; exit 1; }
          grep -q 'function v368RepairActiveView()' /tmp/hub.html
          ! grep -q 'function v368HubAction(' /tmp/hub.html
          ! grep -q "document.addEventListener('pointerup'" /tmp/hub.html
          ! grep -q "document.addEventListener('click'" /tmp/hub.html
          grep -q '\$\$("\[data-view\]").forEach' /tmp/hub.html
          grep -q '\$\$("\.socialDot").forEach' /tmp/hub.html
          docker logs gsf-v369-run > /tmp/v369.log 2>&1 || true
          grep -q 'V368 CREATOR HUB TOUCH RECOVERY CONTRACT: PASS' /tmp/v369.log
          grep -q 'V366 CREATOR HUB PROFILE STATE STABILITY' /tmp/v369.log || grep -q 'V366 CREATOR HUB' /tmp/v369.log
      - name: Show logs on failure
        if: failure()
        run: docker logs gsf-v369-run || true
