name: V427 apply fixes

on:
  push:
    branches:
      - chat/fix-user-mobile-stabilization-20261023
    paths:
      - tools/dev_apply_v427.py
      - .github/workflows/v427-apply-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/fix-user-mobile-stabilization-20261023
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical fixes
        run: python tools/dev_apply_v427.py
      - name: Targeted GREEN verification
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_user_reported_mobile_v427.py
          python web/test_v412_ai_engines.py
          python tests/test_creator_hub_redesign_v415.py
          python -m compileall -q app.py web tests
      - name: Commit canonical sources only
        run: |
          set -euo pipefail
          git rm tools/dev_apply_v427.py .github/workflows/v427-apply-fixes.yml
          git add app.py \
            web/ai_engines_v412.py \
            web/ai_v221_component/index.html \
            web/creator_hub_v156_component/index.html \
            web/direct_upload_server.py \
            web/game_editor_mobile_component/index.html \
            web/gsf_alive_v418.js \
            web/home_v154_component/index.html \
            tests/test_user_reported_mobile_v427.py \
            docs/superpowers/plans/2026-10-23-user-mobile-stabilization.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: resolve user-reported mobile regressions'
          git push origin HEAD:chat/fix-user-mobile-stabilization-20261023
