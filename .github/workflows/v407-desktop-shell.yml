name: V407 Desktop Mobile Shell

on:
  push:
    branches:
      - chat/desktop-mobile-shell-v407-7e31ca
  pull_request:
    paths:
      - 'web/gsf_desktop_shell_v407.py'
      - 'web/install_adsense_bridge.py'
      - 'web/test_v407_desktop_mobile_shell.py'
      - '.github/workflows/v407-desktop-shell.yml'
      - 'docs/architecture/gsf-desktop-mobile-shell.md'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile V407 browser shell module
        run: python -m py_compile web/gsf_desktop_shell_v407.py web/install_adsense_bridge.py
      - name: Run V407 production-path contract
        run: python web/test_v407_desktop_mobile_shell.py
