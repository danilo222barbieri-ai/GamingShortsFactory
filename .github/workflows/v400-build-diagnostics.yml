name: V400 Build Diagnostics

on:
  push:
    branches:
      - v400-ai-hidpi
  workflow_dispatch:

jobs:
  build-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build production image with captured log
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -t gsf-v400:${{ github.sha }} . 2>&1 | tee /tmp/v400-build.log
      - name: Upload V400 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v400-build-log
          path: /tmp/v400-build.log
          if-no-files-found: error
          retention-days: 3
