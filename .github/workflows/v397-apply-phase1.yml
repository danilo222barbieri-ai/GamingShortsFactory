name: V397 Apply Phase1 Source Patch

on:
  push:
    branches:
      - v397-structural-hardening
    paths:
      - .github/workflows/v397-apply-phase1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v397-structural-hardening
          fetch-depth: 0
      - name: Apply tested source edits
        run: |
          python - <<'PY'
          from pathlib import Path

          root=Path('.')
          p=root/'web/direct_upload_server.py'
          text=p.read_text(encoding='utf-8')

          bucket_anchor='''def _bucket_enabled():\n    return bool(S3_BUCKET and S3_ACCESS_KEY and S3_SECRET_KEY and S3_ENDPOINT)\n'''
          health_helper='''def _composite_health(timeout=1.5):\n    streamlit_ready=False\n    try:\n        req=urllib.request.Request(\n            "http://127.0.0.1:8501/_stcore/health",\n            headers={"User-Agent":"GSF-V397-Health/1.0"},\n        )\n        with urllib.request.urlopen(req,timeout=max(0.1,float(timeout))) as response:\n            streamlit_ready=int(getattr(response,"status",0) or 0)==200\n    except Exception:\n        streamlit_ready=False\n    return {\n        "ok":bool(streamlit_ready),\n        "companion":True,\n        "streamlit":streamlit_ready,\n        "bucket":_bucket_enabled(),\n        "worker":bool(WORKER_URL),\n    }\n\n'''
          if 'def _composite_health' not in text:
              if bucket_anchor not in text: raise SystemExit('bucket anchor missing')
              text=text.replace(bucket_anchor,bucket_anchor+'\n'+health_helper,1)

          route_anchor='''        if clean in ("","/health"):\n'''
          route='''        if clean=="/healthz":\n            health=_composite_health()\n            _json(self,200 if health.get("ok") else 503,health)\n            return\n'''
          if 'clean=="/healthz"' not in text:
              if route_anchor not in text: raise SystemExit('health route anchor missing')
              text=text.replace(route_anchor,route+route_anchor,1)

          editor_old='''        print("GSF_EDITOR_MEDIA_MISSING",sid,repr(str(exc)),flush=True)\n        _json(handler,404,{"ok":False,"error":"editor media unavailable"})\n'''
          editor_new='''        print("GSF_EDITOR_MEDIA_NOT_READY",sid,flush=True)\n        handler.send_response(204)\n        handler.send_header("Cache-Control","no-store")\n        handler.end_headers()\n'''
          if 'GSF_EDITOR_MEDIA_NOT_READY' not in text:
              if editor_old not in text: raise SystemExit('editor missing-state anchor missing')
              text=text.replace(editor_old,editor_new,1)

          guardian_anchor='''def _guardian_tick(sid,force=False):\n'''
          social_helper='''def _creator_social_snapshot(sid,providers=None):\n    providers=dict(providers or {})\n    return {\n        "youtube":bool(_youtube_user_load(sid)),\n        "tiktok":bool(_tiktok_user_load(sid)),\n        "instagram":bool(_instagram_user_load(sid)),\n        "facebook":bool(providers.get("facebook")),\n        "twitch":bool(providers.get("twitch")),\n    }\n\n'''
          if 'def _creator_social_snapshot' not in text:
              if guardian_anchor not in text: raise SystemExit('guardian anchor missing')
              text=text.replace(guardian_anchor,social_helper+guardian_anchor,1)

          state_anchor='''            providers=dict(profile.get("providers") or {}) if isinstance(profile,dict) else {}\n            limits=_storage_limits_for_sid(sid)\n'''
          state_new='''            providers=dict(profile.get("providers") or {}) if isinstance(profile,dict) else {}\n            social_snapshot=_creator_social_snapshot(sid,providers)\n            limits=_storage_limits_for_sid(sid)\n'''
          if 'social_snapshot=_creator_social_snapshot(sid,providers)' not in text:
              if state_anchor not in text: raise SystemExit('creator state anchor missing')
              text=text.replace(state_anchor,state_new,1)

          social_old='''                "social":{\n                    "youtube":bool(_youtube_user_load(sid)),\n                    "tiktok":bool(_tiktok_user_load(sid)),\n                    "instagram":bool(_instagram_user_load(sid)),\n                    "facebook":bool(providers.get("facebook")),\n                    "twitch":bool(providers.get("twitch")),\n                },\n'''
          if social_old in text:
              text=text.replace(social_old,'                "social":social_snapshot,\n',1)
          stats_old='''                    "social":sum(1 for x in (_youtube_user_load(sid),_tiktok_user_load(sid),_instagram_user_load(sid),providers.get("facebook"),providers.get("twitch")) if x),\n'''
          stats_new='''                    "social":sum(1 for connected in social_snapshot.values() if connected),\n'''
          if stats_old in text:
              text=text.replace(stats_old,stats_new,1)

          p.write_text(text,encoding='utf-8')

          nginx=root/'web/nginx.conf.template'
          n=nginx.read_text(encoding='utf-8')
          if 'location = /healthz' not in n:
              anchor='''    location = /job/status {\n'''
              block='''    location = /healthz {\n        proxy_pass http://127.0.0.1:8502/healthz;\n        proxy_http_version 1.1;\n        proxy_buffering off;\n        proxy_set_header Host $host;\n        add_header Cache-Control "no-store" always;\n    }\n\n'''
              if anchor not in n: raise SystemExit('nginx health anchor missing')
              n=n.replace(anchor,block+anchor,1)
              nginx.write_text(n,encoding='utf-8')

          start=root/'web/start_web.sh'
          s=start.read_text(encoding='utf-8')
          s=s.replace('python /app/web/runtime_smoke_v107.py &\n','')
          start.write_text(s,encoding='utf-8')
          PY
          python web/test_v397_production_hardening.py .
          python -m py_compile web/direct_upload_server.py web/runtime_smoke_v107.py
      - name: Commit source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/direct_upload_server.py web/nginx.conf.template web/start_web.sh
          git commit -m "feat: harden V397 frontend health and state paths"
          git push origin HEAD:v397-structural-hardening
