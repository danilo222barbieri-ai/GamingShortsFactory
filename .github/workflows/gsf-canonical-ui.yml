name: GSF Canonical UI

# 1. guard: the canonical UI pipeline contract (fast, every relevant PR).
# 2. legacy-equivalence: while the PR base still uses the old patch-chain
#    Dockerfile, build that old image for real and prove the canonical files in
#    this PR are byte-identical to what it served (zero UI change on cut-over).
#    Once main is canonical this job detects it and skips itself.

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'app.py'
      - 'web/**'
      - 'tools/gsf_ui_manifest.py'
      - 'tests/test_canonical_ui_pipeline.py'
      - '.github/workflows/gsf-canonical-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tests/test_canonical_ui_pipeline.py

  legacy-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Detect legacy base
        id: base
        run: |
          base=${{ github.event.pull_request.base.sha || 'origin/main' }}
          git worktree add /tmp/gsf-base "$base"
          if grep -q 'materialize_runtime_patches.sh &&' /tmp/gsf-base/Dockerfile; then
            echo "legacy=1" >> "$GITHUB_OUTPUT"; echo "Base $base uses the legacy patch chain: comparing"
          else
            echo "legacy=0" >> "$GITHUB_OUTPUT"; echo "::notice title=Legacy equivalence::base is already canonical; nothing to compare"
          fi

      - name: Build the legacy base image
        if: steps.base.outputs.legacy == '1'
        run: |
          set -o pipefail
          cd /tmp/gsf-base
          if ! docker build --progress=plain -t gsf-legacy-base . 2>&1 | tee /tmp/legacy-build.log; then
            if grep -Eq '429 Too Many Requests|Data limit exceeded' /tmp/legacy-build.log; then
              sed -i '1s#^FROM public.ecr.aws/docker/library/python:3.12-slim$#FROM python:3.12-slim#' Dockerfile
              docker build --progress=plain -t gsf-legacy-base .
            else
              grep -nE 'Error|ERROR|FAIL|Traceback' /tmp/legacy-build.log | tail -n 8 | while IFS= read -r l; do echo "::error title=legacy build::$(printf '%s' "$l" | cut -c1-400)"; done
              exit 1
            fi
          fi

      - name: Canonical files == files served by the legacy image
        if: steps.base.outputs.legacy == '1'
        run: |
          set -euo pipefail
          docker create --name legacy gsf-legacy-base >/dev/null
          mkdir -p /tmp/legacy
          docker cp legacy:/app/GamingShortsFactory_V293_RENDER_MEMORY_GUARD.py /tmp/legacy/app.py
          for f in web/home_v154_component/index.html web/creator_hub_v156_component/index.html \
                   web/editor_2027_component/index.html web/ai_v221_component/index.html \
                   web/share_v156_component/index.html web/publish_short_v405_component/index.html \
                   web/nginx.conf.template web/direct_upload_server.py web/home_v154_embed.py \
                   web/editor_2027_embed.py web/gsf_bucket_bridge.py web/app_icons/app-icon.png; do
            mkdir -p "/tmp/legacy/$(dirname "$f")"; docker cp "legacy:/app/$f" "/tmp/legacy/$f"
          done
          python - <<'PY'
          import difflib, pathlib, sys
          repo, legacy = pathlib.Path('.'), pathlib.Path('/tmp/legacy')
          bad = 0
          for f in sorted(p.relative_to(legacy) for p in legacy.rglob('*') if p.is_file()):
              a, b = (legacy / f).read_bytes(), (repo / f).read_bytes()
              if a == b:
                  print(f'identical: {f}'); continue
              if str(f) == 'web/direct_upload_server.py':
                  # the only intended change: additive /healthz ui_digest + release fields
                  diff = [l for l in difflib.unified_diff(a.decode().splitlines(), b.decode().splitlines(), lineterm='', n=0)
                          if l[:1] in '+-' and not l.startswith(('+++', '---'))]
                  removed = [l for l in diff if l.startswith('-')]
                  added = '\n'.join(l for l in diff if l.startswith('+'))
                  if not removed and 'GSF_CANONICAL_UI' in added and '_canonical_ui_digest' in added and len(diff) < 30:
                      print(f'expected additive healthz change only: {f}'); continue
              bad += 1
              print(f'::error title=Legacy equivalence::{f} differs from what the legacy image served')
          if bad:
              sys.exit(1)
          print('::notice title=Legacy equivalence::canonical files are byte-identical to the legacy production image')
          PY
