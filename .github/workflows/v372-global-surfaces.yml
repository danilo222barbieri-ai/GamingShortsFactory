name: V372 global surfaces

on:
  push:
    branches:
      - v372-global-surfaces

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply V370 canonical navigation
        run: python web/fix_v370_single_navigation_owner.py .
      - name: Apply V372 global surfaces
        run: python web/fix_v372_global_surface_owner.py .
      - name: V370 single navigation owner regression
        run: python web/test_v370_single_navigation_owner.py .
      - name: V372 global surface owner contract
        run: python web/test_v372_global_surface_owner.py .
      - name: V372 navigation no-rerun contract
        run: python web/test_v372_navigation_no_rerun.py .
      - name: Inspect canonical V343 routes
        run: |
          python - <<'PY'
          import base64,gzip,importlib.util,re
          from pathlib import Path
          p=Path('web/fix_v343_single_global_shell.py')
          spec=importlib.util.spec_from_file_location('v343',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          js=gzip.decompress(base64.b64decode(m.JS_GZIP_B64)).decode()
          for name in ('closeCompeting','openEditor','ensureShortSurface','openShort','route'):
              hit=re.search(r'(?:const\s+'+name+r'\s*=|function\s+'+name+r'\b).*?(?=\n\s*(?:const\s+\w+\s*=|function\s+\w+\b)|\Z)',js,re.S)
              print('\n===',name,'===\n',hit.group(0)[:5000] if hit else 'NOT FOUND')
          PY

  production-image:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build -t gsf-v372 .
      - name: Start production image
        run: |
          docker run -d --name gsf-v372 -p 18080:8080 gsf-v372
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/_stcore/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs gsf-v372
          exit 1
      - name: Verify live surfaces with iPhone UA
        run: |
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/27.0.1 Mobile/15E148 Safari/604.1'
          curl -fsS -A "$UA" http://127.0.0.1:18080/ >/dev/null
          curl -fsS -A "$UA" http://127.0.0.1:18080/creator-hub-v156/ >/dev/null
          curl -fsS -A "$UA" http://127.0.0.1:18080/editor-live/ >/dev/null
          curl -fsS -A "$UA" http://127.0.0.1:18080/ai-v221/ >/dev/null
          echo 'V372 production image + iPhone surface smoke: PASS'
      - name: Show V372 startup evidence
        if: always()
        run: docker logs gsf-v372 2>&1 | grep -E 'V370|V372|PASS|ERROR|Traceback' | tail -120 || true
