name: V405 Alive Core

on:
  push:
    branches:
      - chat/alive-core-v405-b6f2a1
    paths:
      - app.py
      - gsf_alive.py
      - tests/test_gsf_alive.py
      - scripts/apply_v405_alive.py
      - .github/workflows/v405-alive-core.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alive-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chat/alive-core-v405-b6f2a1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Alive core tests
        run: python -m unittest tests/test_gsf_alive.py

      - name: Apply deterministic app integration
        run: python scripts/apply_v405_alive.py app.py

      - name: Compile changed Python
        run: python -m py_compile gsf_alive.py scripts/apply_v405_alive.py app.py

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit app integration if needed
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo "app.py already contains the Alive bootstrap."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "feat: wire GSF Alive into app [skip ci]"
          git push origin HEAD:chat/alive-core-v405-b6f2a1
