name: V408 Project State

on:
  push:
    branches:
      - chat/project-state-v408-3f4b21
  pull_request:
    paths:
      - 'gsf_project_state.py'
      - 'tests/test_gsf_project_state.py'
      - 'docs/architecture/gsf-project-state.md'
      - '.github/workflows/v408-project-state.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile project-state boundary
        run: python -m compileall -q gsf_project_state.py tests/test_gsf_project_state.py
      - name: Project state contract
        run: python -m unittest tests/test_gsf_project_state.py -v
      - name: Alive compatibility contract
        run: python -m unittest tests/test_gsf_alive.py -v
