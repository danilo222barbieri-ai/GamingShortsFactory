name: V92 release check

on:
  push:
    branches:
      - v92-release

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build V92 image
        run: docker build --progress=plain -t gsf-v92 .

      - name: Start V92 locally
        run: |
          docker run -d --name gsf-v92 -p 8080:8080 \
            -e PORT=8080 \
            -e GSF_WEB_MODE=1 \
            -e GSF_LOW_MEMORY_WEB=1 \
            -e GSF_AI_VOICE_TRANSCRIPTION=0 \
            gsf-v92
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/_stcore/health >/dev/null; then
              echo "V92 health ready"
              exit 0
            fi
            sleep 2
          done
          docker logs gsf-v92
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser and make test video
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=640x360:rate=30:duration=48" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=48" \
            -filter:a "volume='if(lt(mod(t,7),2),1,0.10)':eval=frame" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 128k -shortest reaction_test.mp4

      - name: Exercise Reazioni engine
        run: |
          cat > v92-reaction.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:1000}});
          page.setDefaultTimeout(30000);
          try{
            await page.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('input[type="file"]').waitFor({state:'attached',timeout:60000});
            await page.locator('input[type="file"]').setInputFiles('reaction_test.mp4');
            await page.getByText('Video caricato',{exact:false}).waitFor({state:'visible',timeout:90000});

            const b15=page.getByRole('button',{name:/^15s$/i});
            if(await b15.count()) await b15.first().click();

            const reaction=page.getByRole('button',{name:/Auto Clip|Reazioni/i});
            if(!(await reaction.count())) throw new Error('Reaction engine button not found');
            await reaction.first().click();

            const create=page.getByRole('button',{name:'CREA CON AI',exact:true});
            await create.waitFor({state:'visible'});
            const t0=Date.now();
            await create.click();
            await page.getByText('Scegli il tuo momento',{exact:false}).waitFor({state:'visible',timeout:360000});
            await page.waitForFunction(()=>{
              const labels=[...document.querySelectorAll('button')].map(b=>(b.innerText||'').trim());
              return labels.filter(t=>/SCEGLI QUESTO|SELEZIONATA/i.test(t)).length>=3;
            },null,{timeout:360000});
            const elapsed=((Date.now()-t0)/1000).toFixed(1);
            const count=await page.getByRole('button',{name:/SCEGLI QUESTO|SELEZIONATA/i}).count();
            console.log('REACTION AI seconds:',elapsed);
            console.log('REACTION AI candidates:',count);
            if(count<3) throw new Error('Reaction engine returned fewer than 3 candidates');

            const edit=page.getByRole('button',{name:/MODIFICA NELL.?EDITOR/i});
            await edit.waitFor({state:'visible',timeout:120000});
            console.log('V92 REACTION E2E PASS');
          }finally{
            await browser.close();
          }
          EOF
          node v92-reaction.mjs

      - name: Resource snapshot
        if: always()
        run: |
          docker stats --no-stream gsf-v92 || true
          docker logs gsf-v92 > v92-container.log 2>&1 || true
          tail -n 120 v92-container.log || true

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v92-release-check
          path: v92-container.log
          if-no-files-found: warn
