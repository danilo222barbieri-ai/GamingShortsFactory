name: V368 Hub touch recovery

on:
  push:
    branches:
      - v368-hub-touch-recovery
  workflow_dispatch:

jobs:
  hub-touch-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Run V368 touch recovery contract
        run: python web/test_v368_creator_hub_touch_recovery.py .

      - name: Build production image
        run: docker build --progress=plain -t gsf-v368 .

      - name: Start production image
        run: docker run -d --name gsf-v368-run -p 8080:8080 -e PORT=8080 -e GSF_WEB_MODE=1 gsf-v368

      - name: Verify startup, Hub runtime and served JavaScript
        run: |
          set -eu
          ready=0
          for i in $(seq 1 120); do
            if ! docker inspect -f '{{.State.Running}}' gsf-v368-run 2>/dev/null | grep -q true; then
              echo 'V368 container stopped before Hub became ready'
              docker logs gsf-v368-run || true
              exit 1
            fi

            curl -fsS "http://127.0.0.1:8080/creator-hub-v156/?v=3681&probe=${i}" -o /tmp/hub.html 2>/dev/null || true
            if test -s /tmp/hub.html && grep -q 'V368_CREATOR_HUB_TOUCH_RECOVERY' /tmp/hub.html; then
              echo "V368 served Hub runtime ready on probe ${i}"
              ready=1
              break
            fi

            if [ $((i % 10)) -eq 0 ]; then
              echo "Waiting for patched Hub runtime; probe ${i}"
              docker logs --tail 60 gsf-v368-run || true
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo 'V368 marker never appeared in served Hub HTML'
            test -f /tmp/hub.html && tail -n 80 /tmp/hub.html || true
            docker logs --tail 220 gsf-v368-run || true
            exit 1
          fi

          grep -q "document.addEventListener('pointerup',v368PointerUp,true)" /tmp/hub.html || { echo 'V368 pointerup capture missing from served Hub'; exit 1; }
          grep -q "document.addEventListener('click',v368Click,true)" /tmp/hub.html || { echo 'V368 click capture missing from served Hub'; exit 1; }
          grep -q "frame.closest('#gsf-creator-hub-live-v160')" /tmp/hub.html || { echo 'V368 Hub-only overlay repair missing'; exit 1; }
          grep -q "overlay.style.pointerEvents='auto'" /tmp/hub.html || { echo 'V368 overlay pointer recovery missing'; exit 1; }

          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/hub.html').read_text(encoding='utf-8')
          m = re.search(r'<script id="v368CreatorHubTouchRecoveryRuntime">(.*?)</script>', html, re.S)
          if not m:
              raise SystemExit('V368 served runtime script missing')
          Path('/tmp/v368.js').write_text(m.group(1), encoding='utf-8')
          print('V368 served runtime extracted')
          PY
          node --check /tmp/v368.js

          log_ready=0
          for i in $(seq 1 30); do
            docker logs gsf-v368-run > /tmp/gsf-v368.log 2>&1 || true
            if grep -q 'V368 CREATOR HUB TOUCH RECOVERY CONTRACT: PASS' /tmp/gsf-v368.log && grep -q 'V368 Creator Hub touch recovery applied' /tmp/gsf-v368.log; then
              log_ready=1
              break
            fi
            sleep 1
          done
          if [ "$log_ready" -ne 1 ]; then
            echo 'V368 startup markers missing from runtime logs'
            tail -n 220 /tmp/gsf-v368.log || true
            exit 1
          fi

          if grep -q 'V367 single active surface applied' /tmp/gsf-v368.log; then
            echo 'V367 global arbiter unexpectedly active'
            tail -n 220 /tmp/gsf-v368.log
            exit 1
          fi
          echo 'V368 production container: HEALTHY, Hub runtime served, JS syntax valid'

      - name: Show logs on failure
        if: failure()
        run: docker logs gsf-v368-run || true
