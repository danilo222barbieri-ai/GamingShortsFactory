version: 2
# One grouped PR per ecosystem per month: each Dependabot PR runs CI, and
# weekly single-package PRs were ~100 CI runs a month.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns: ["*"]
    labels:
      - dependencies
      - security
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "05:30"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - dependencies
