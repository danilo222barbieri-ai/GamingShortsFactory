<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GSF · Mobile</title>
<style>
:root{color-scheme:light;--ink:#102858;--soft:#7286a5;--line:rgba(143,177,208,.28);--blue:#86d8ff;--mint:#8be5c7}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 18% 15%,rgba(134,216,255,.24),transparent 31%),radial-gradient(circle at 82% 18%,rgba(139,229,199,.20),transparent 32%),linear-gradient(180deg,#fcfeff,#f4faff);color:var(--ink);font-family:"Avenir Next","SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(520px,100%);padding:42px 34px;border:1px solid var(--line);border-radius:32px;background:rgba(255,255,255,.82);box-shadow:0 24px 70px rgba(76,115,153,.12);backdrop-filter:blur(18px);text-align:center}
.mark{width:108px;height:108px;margin:0 auto 28px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 36% 30%,#fff,#e9f8ff 58%,#e5fbf3);border:1px solid rgba(107,201,232,.38);box-shadow:0 0 0 18px rgba(125,217,255,.06),0 0 0 34px rgba(105,225,190,.035)}
.mark svg{width:49px;height:49px;fill:none;stroke:#5f9bd2;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{font-size:12px;font-weight:900;letter-spacing:.35em;color:#7185a5;text-transform:uppercase;margin-bottom:18px}
h1{margin:0;font-size:clamp(30px,5vw,42px);line-height:1.04;letter-spacing:-.04em;font-weight:900}
p{margin:18px auto 0;max-width:360px;color:var(--soft);font-size:15px;line-height:1.55;font-weight:650}
.note{margin-top:22px;font-size:11px;color:#8b9ab0;font-weight:750}
</style>
</head>
<body>
<main class="card" aria-labelledby="title">
 <div class="mark" aria-hidden="true">
  <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M10 5h4M11 18.5h2"/></svg>
 </div>
 <div class="brand">Gaming Shorts Factory</div>
 <h1 id="title">GSF è disponibile da smartphone</h1>
 <p>Apri Gaming Shorts Factory dal tuo telefono per creare, modificare e pubblicare i tuoi Short.</p>
 <div class="note">Esperienza mobile</div>
</main>
</body>
</html>
