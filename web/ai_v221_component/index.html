<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GSF Motori IA</title>
<style>
/* GSF V413 CREA CON IA — Home mural style. One screen, no scrolling.
   Engines: one big glass circle (the search button) with four engine bubbles around it.
   Results: three portal circles (score as the ring), one detail card, two pill actions. */
:root{
  /* Brand kit v1 + GSF one-style ink */
  --gsf-primary:#27AEF3;--gsf-ai:#9D82FF;--gsf-cyan:#53E0EA;--gsf-short:#5ED6A0;
  --gsf-line:#D9EFFB;--gsf-ink:#0D2A66;--gsf-muted:#7185A6;--gsf-mural:#637DA8;
  --gsf-sky:#E6F4FF;--gsf-mint:#E3F8EF;--gsf-sun:#FFF1C9;--gsf-violet:#EEE8FF;--gsf-rose:#FFE7EC;
  --gsf-font:"Avenir Next","SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --gsf-mural-font:"Comic Sans MS","Bradley Hand","Segoe Print","Chalkboard SE",cursive;
  --gsf-mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#FAFDFF;color:var(--gsf-ink);font-family:var(--gsf-font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid rgba(39,174,243,.35);outline-offset:4px;border-radius:999px}

#ai404{position:relative;height:100%;overflow:hidden;overscroll-behavior:none;isolation:isolate;display:flex;flex-direction:column;
  /* GSF_AI_SHELL_FIT: --shell-top/--shell-bottom are the parts of this frame covered by the
     shell header and Game Bar/footer, measured from the parent page (0 when none overlaps). */
  padding-top:calc(max(12px,env(safe-area-inset-top,0px)) + var(--shell-top,0px));
  padding-bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + var(--shell-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px)); /* GSF_ONE_STYLE gutter */
  background:
    radial-gradient(ellipse 55% 35% at 6% 14%,rgba(126,205,255,.18),transparent 70%),
    radial-gradient(ellipse 50% 32% at 96% 10%,rgba(127,236,197,.16),transparent 70%),
    radial-gradient(120% 55% at 50% 100%,rgba(122,200,255,.10),transparent 72%),
    linear-gradient(180deg,#FAFDFF 0%,#F7FBFF 60%,#F2F8FE 100%)} /* GSF_HEADER_CANVAS: header colour fading into a soft glow */
.shell{flex:1;min-height:0;width:min(980px,100%);margin:0 auto;display:flex;flex-direction:column}

.pill{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:4px 13px 4px 4px;border-radius:999px;background:rgba(255,255,255,.9);border:1px solid var(--gsf-line);box-shadow:0 6px 18px rgba(39,90,140,.08);font-size:11.5px;font-weight:800;color:#3E5880;white-space:nowrap}
.pill .dot{width:26px;height:26px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#E3EDF6);color:#9AAFC4}
.pill .dot svg{width:13px;height:13px}
.pill.ok .dot{background:radial-gradient(circle at 35% 30%,#fff,#D6F6E7);color:#2C9C6C}
.pill.busy .dot svg{animation:spin 1s linear infinite}

/* murals */
.mural{position:absolute;z-index:3;margin:0;pointer-events:none;font-family:var(--gsf-mural-font);font-weight:700;color:var(--gsf-mural);line-height:1.05;font-size:clamp(17px,4.6vw,24px);transition:opacity .35s var(--ease),filter .35s var(--ease)}
.mural.swap{opacity:0;filter:blur(3px)}
.m1{left:1%;top:0;transform:rotate(-6deg)}
.m2{right:2%;top:0;transform:rotate(4deg);text-align:center}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.is-active{display:flex;animation:enter .45s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- engines ---------- */
.stage{position:relative;flex:1;min-height:0}
.orb{--d:min(50vw,34vh,320px);position:absolute;z-index:2;left:50%;top:53%;width:var(--d);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--d)/-2);border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.99),rgba(234,247,255,.82) 54%,rgba(229,255,247,.76));
  border:1px solid rgba(121,205,235,.42);
  box-shadow:0 0 0 calc(var(--d)*.07) rgba(130,218,255,.06),0 0 0 calc(var(--d)*.13) rgba(99,226,192,.04),0 22px 65px rgba(74,132,176,.16),inset 0 0 40px rgba(255,255,255,.8);
  transition:transform .3s var(--ease),filter .3s}
.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.orb:before{inset:calc(var(--d)*-.07);border:1px solid rgba(83,195,237,.26)}
.orb:after{inset:calc(var(--d)*-.13);border:1px solid rgba(99,226,192,.18)}
.orb:hover:not(:disabled){transform:scale(1.02)}
.orb:disabled:not(.busy){filter:grayscale(.5) opacity(.72)}
.orb-in{display:grid;justify-items:center;gap:6px;padding:12%}
.orb-icon{width:clamp(38px,10vw,60px);height:clamp(38px,10vw,60px);color:#4A90D9}
.orb-title{font-size:clamp(19px,5.2vw,30px);font-weight:900;line-height:1.02;letter-spacing:-.01em}
.orb-sub{font-size:clamp(11px,2.8vw,13px);font-weight:700;color:var(--gsf-muted);line-height:1.3}
.orb-time{display:none;font-family:var(--gsf-mono);font-size:clamp(26px,7vw,40px);font-weight:600;font-variant-numeric:tabular-nums}
.sweep{position:absolute;inset:calc(var(--d)*-.07);border-radius:50%;pointer-events:none;opacity:0;
  background:conic-gradient(from 0deg,transparent 0 70%,rgba(157,130,255,.55) 92%,rgba(83,224,234,.9) 100%);
  -webkit-mask:radial-gradient(circle,transparent calc(50% - 3px),#000 calc(50% - 2px),#000 50%,transparent calc(50% + 1px));mask:radial-gradient(circle,transparent calc(50% - 3px),#000 calc(50% - 2px),#000 50%,transparent calc(50% + 1px))}
.scanning .sweep{opacity:1;animation:spin 1.8s linear infinite}
.scanning .orb{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 calc(var(--d)*.09) rgba(157,130,255,.08),0 0 0 calc(var(--d)*.16) rgba(83,224,234,.05),0 22px 65px rgba(108,85,217,.18),inset 0 0 40px rgba(255,255,255,.8)}}
.scanning .orb-icon,.scanning .orb-title{display:none}
.scanning .orb-time{display:block}
.failed .orb-icon{color:#C0536A}

.eng{position:absolute;z-index:4;display:grid;justify-items:center;gap:6px;width:min(27vw,128px);text-align:center;transition:transform .3s var(--ease),opacity .3s}
.bub{position:relative;width:min(17vw,74px);height:min(17vw,74px);border-radius:50%;display:grid;place-items:center;color:var(--acc);
  background:radial-gradient(circle at 34% 28%,#fff,var(--tint));border:1px solid color-mix(in srgb,var(--acc) 26%,#fff);box-shadow:0 10px 24px rgba(39,90,140,.10);transition:.3s var(--ease)}
.bub svg{width:44%;height:44%}
.eng b{font-size:12.5px;font-weight:900;letter-spacing:.1em}
.eng .d{font-size:11px;font-weight:650;color:var(--gsf-muted);line-height:1.25}
.eng.is-selected .bub{box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 16%,transparent),0 0 0 13px color-mix(in srgb,var(--acc) 7%,transparent),0 14px 30px color-mix(in srgb,var(--acc) 30%,transparent);transform:scale(1.08)}
.eng.is-selected b{color:color-mix(in srgb,var(--acc) 70%,var(--gsf-ink))}
.eng:hover:not(:disabled) .bub{transform:scale(1.06)}
.scanning .eng:not(.is-selected){opacity:.28}
.e1{left:0;top:16%}.e2{right:0;top:16%}.e3{left:0;bottom:9%}.e4{right:0;bottom:9%}
.eng[data-engine="auto"]{--acc:var(--gsf-ai);--tint:var(--gsf-violet)}
.eng[data-engine="action"]{--acc:#E3A21A;--tint:var(--gsf-sun)}
.eng[data-engine="reaction"]{--acc:#E2506E;--tint:var(--gsf-rose)}
.eng[data-engine="best"]{--acc:#1E9BD8;--tint:var(--gsf-sky)}

.foot{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;padding-top:6px}
.label{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--gsf-muted)}
/* GSF_V427_DURATION_INLINE */
.seg{display:inline-grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px;border-radius:999px;background:rgba(255,255,255,.88);border:1px solid var(--gsf-line);box-shadow:0 6px 18px rgba(39,90,140,.07)}
.seg button{min-width:64px;min-height:36px;border-radius:999px;font-size:13px;font-weight:800;color:var(--gsf-muted);font-variant-numeric:tabular-nums}
.seg button.active{background:linear-gradient(180deg,#fff,#EAF6FF);color:var(--gsf-ink);box-shadow:0 3px 10px rgba(39,90,140,.12)}

/* ---------- results ---------- */
.top2{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-top:8px}
.results-title{position:relative;margin:4px 0 0;font-family:var(--gsf-font);font-weight:700;color:var(--gsf-mural);line-height:1.05;font-size:clamp(22px,6vw,30px)}
.results-title small{display:block;margin-top:6px;font-family:var(--gsf-font);font-size:11px;font-weight:800;letter-spacing:.14em;color:#6C55D9}
.side{display:grid;justify-items:end;gap:7px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.92);border:1px solid var(--gsf-line);font-size:12px;font-weight:800;color:#3E5880}
.back svg{width:14px;height:14px}

/* GSF_V428_MOMENT_CAROUSEL */
.portals{flex:1;min-height:0;display:flex;align-items:center;justify-content:flex-start;gap:clamp(16px,5vw,28px);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;padding:12px calc(50% - min(19vw,14.5vh,115px))}
.portals::-webkit-scrollbar{display:none}
.short{--s:min(38vw,29vh,230px);position:relative;flex:0 0 auto;width:var(--s);height:var(--s);border-radius:50%;cursor:pointer;scroll-snap-align:center;scroll-snap-stop:always;opacity:.66;transform:scale(.88);transition:transform .32s var(--ease),opacity .32s var(--ease)}
.short.is-selected{opacity:1;transform:scale(1)}
.moment-dots{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:7px;min-height:18px;margin:-2px 0 5px}.moment-dot{width:7px;height:7px;padding:0;border-radius:50%;background:rgba(159,183,202,.38);transition:transform .22s var(--ease),background .22s var(--ease)}.moment-dot.is-selected{transform:scale(1.45);background:var(--gsf-cyan)}
.short .ring{position:absolute;inset:-9px;border-radius:50%;pointer-events:none}
.short .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.frame{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:3px solid #fff;background:#0E2236;box-shadow:0 16px 40px rgba(39,90,140,.18)}
.frame img,.frame video,.frame .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.32),transparent 45%)}
.frame.playing:after{display:none}
.cover{background:var(--c1)}
.cover:before{content:"";position:absolute;left:-20%;right:-20%;bottom:0;height:45%;background:var(--c2);clip-path:polygon(0 60%,14% 30%,28% 52%,44% 18%,58% 46%,72% 24%,86% 50%,100% 34%,100% 100%,0 100%)}
.cover:after{content:"";position:absolute;left:22%;top:24%;width:30%;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--gsf-short) 70%,rgba(255,255,255,.3) 70%)}
.play{position:absolute;z-index:2;left:50%;top:50%;width:34%;height:34%;max-width:56px;max-height:56px;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.6);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.play svg{width:40%;height:40%;margin-left:6%}
.frame.playing~.play,.frame.playing .poster{display:none}
.rank{position:absolute;z-index:3;left:50%;top:-4px;transform:translate(-50%,-50%);padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--gsf-line);font-size:10.5px;font-weight:900;letter-spacing:.08em;white-space:nowrap;box-shadow:0 4px 12px rgba(39,90,140,.12)}
.short.is-selected .rank{background:linear-gradient(100deg,var(--gsf-ai),var(--gsf-primary));color:#fff;border-color:transparent}
.score{position:absolute;z-index:3;left:50%;bottom:-6px;transform:translate(-50%,50%);font-family:var(--gsf-mono);font-size:11px;font-weight:700;color:#5B44C9;background:#fff;padding:2px 8px;border-radius:999px;border:1px solid var(--gsf-line)}
.short.swapping .frame{animation:swapIn .6s var(--ease)}
@keyframes swapIn{40%{filter:blur(8px) hue-rotate(70deg);opacity:.3}}
.empty-state{font-family:var(--gsf-mural-font);font-weight:700;font-size:20px;color:var(--gsf-mural)}

.card{flex:0 0 auto;margin-top:12px;padding:14px 16px;border-radius:26px;background:rgba(255,255,255,.9);border:1px solid #E3F1FA;box-shadow:0 14px 38px rgba(39,90,140,.08);display:grid;gap:7px}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0}
.card h2{margin:0;min-width:0;font-size:clamp(17px,4.6vw,22px);font-weight:900;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card h2 .num{font-size:11px;font-weight:900;letter-spacing:.12em;color:#6C55D9;margin-right:8px;vertical-align:2px}
.tc{flex:0 0 auto;font-family:var(--gsf-mono);font-size:12px;color:var(--gsf-muted);font-variant-numeric:tabular-nums}
.why{margin:0;font-size:12.5px;font-weight:600;color:var(--gsf-muted);line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags-row{display:flex;align-items:center;gap:6px;min-width:0}
.tags{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;min-width:0}
.tag{flex:0 0 auto;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;background:var(--gsf-violet);color:#5B44C9}
.tag.tag-2{background:var(--gsf-sky);color:#1477AE}
.change{margin-left:auto;flex:0 0 auto;font-family:var(--gsf-mural-font);font-weight:700;font-size:15px;color:var(--gsf-mural);text-decoration:underline wavy rgba(157,130,255,.6);text-underline-offset:4px;padding:4px 2px;white-space:nowrap}
.change:disabled{opacity:.4}

.acts{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.act{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:8px 14px 8px 8px;border-radius:999px;background:rgba(255,255,255,.94);border:1px solid #E3F1FA;box-shadow:0 10px 26px rgba(39,90,140,.09);font-size:14px;font-weight:900;letter-spacing:.02em;transition:transform .2s var(--ease)}
.act:hover:not(:disabled){transform:translateY(-1px)}
.act:disabled{opacity:.45;box-shadow:none}
.act .ic{width:42px;height:42px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center}
.act .ic svg{width:20px;height:20px}
.act.ed .ic{background:radial-gradient(circle at 34% 28%,#fff,#D8F5E8);color:#2C9C6C}
.act.pub{background:linear-gradient(100deg,#FFFFFF,#FFF6DA);border-color:#F7E3A8}
.act.pub .ic{background:radial-gradient(circle at 34% 28%,#fff,#FFE7A6);color:#C98700}

/* Cambia short */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-top:var(--shell-top,0px);padding-bottom:var(--shell-bottom,0px);background:rgba(232,244,252,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet{width:min(560px,100%);display:grid;padding:20px max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-radius:32px 32px 0 0;background:#fff;box-shadow:0 -20px 50px rgba(39,90,140,.16);animation:up .35s var(--ease)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sheet-head h2{margin:0;font-family:var(--gsf-mural-font);font-weight:700;font-size:22px;color:var(--gsf-mural);transform:rotate(-2deg);transform-origin:left}
.sheet-head p{margin:6px 0 0;font-size:12.5px;font-weight:600;color:var(--gsf-muted)}
.close{width:38px;height:38px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:#F0F7FC;color:var(--gsf-muted)}
.close svg{width:15px;height:15px}
.alts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.alt{display:grid;justify-items:center;gap:7px;text-align:center;min-width:0}
.alt .thumb{position:relative;width:min(24vw,104px);height:min(24vw,104px);border-radius:50%;overflow:hidden;border:3px solid #fff;background:#0E2236;box-shadow:0 10px 26px rgba(39,90,140,.16);transition:transform .2s var(--ease)}
.alt:hover .thumb{transform:scale(1.05)}
.alt .thumb img,.alt .thumb video,.alt .thumb .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.alt strong{font-size:12px;font-weight:900;line-height:1.2}
.alt .t{font-family:var(--gsf-mono);font-size:10.5px;color:var(--gsf-muted)}
.restore{justify-self:center;margin-top:14px;font-family:var(--gsf-mural-font);font-weight:700;font-size:15px;color:var(--gsf-mural);text-decoration:underline;text-underline-offset:4px}
.sheet-empty{grid-column:1/-1;padding:18px;border-radius:18px;background:#F5FAFD;color:var(--gsf-muted);font-size:13px;font-weight:650;line-height:1.45}

@media (min-width:761px){
  .e1{left:8%;top:18%}.e2{right:8%;top:18%}.e3{left:8%;bottom:10%}.e4{right:8%;bottom:10%}
  .eng{width:150px}.bub{width:84px;height:84px}
  .m1{left:6%;top:2%}.m2{right:7%;top:2%}
  .card,.acts{width:min(640px,100%);margin-inline:auto}
}
@media (max-height:640px){.eng .d{display:none}.why{-webkit-line-clamp:1}}
@media (max-width:360px){.eng .d{display:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* GSF_NIGHT_ARENA:BEGIN */
/* GSF Night Arena v1 — the single look of the whole app.
   Canonical source. Every surface inlines this block verbatim between
   GSF_NIGHT_ARENA:BEGIN / GSF_NIGHT_ARENA:END (tests/test_night_arena_theme.py).
   Brand hues are the official kit (design/brand); only the surface/text
   roles are re-mapped for the dark ground. */
:root{
 color-scheme:dark;
 /* Ground */
 --na-bg:#050D16;
 --na-bg-2:#081827;
 --na-deep:#0A1D2E;
 /* Glass */
 --na-glass:rgba(16,40,61,.55);
 --na-glass-strong:rgba(16,40,61,.78);
 --na-glass-hi:rgba(255,255,255,.06);
 --na-edge:rgba(121,210,255,.18);
 --na-edge-strong:rgba(121,210,255,.32);
 --na-shine:inset 0 1px 0 rgba(255,255,255,.08);
 --na-shadow:0 18px 40px rgba(0,0,0,.45);
 /* Text */
 --na-text:#EAF6FF;
 --na-text-strong:#FFFFFF;
 --na-text-muted:#9FB7CA;
 --na-text-faint:#6F879A;
 /* Area glows (official hues) */
 --na-glow-primary:0 0 24px rgba(39,174,243,.45);
 --na-glow-ai:0 0 24px rgba(157,130,255,.5);
 --na-glow-short:0 0 24px rgba(94,214,160,.45);
 --na-ring:conic-gradient(from 0deg,#27AEF3,#53E0EA,#5ED6A0,#9D82FF,#27AEF3);
 --na-cta:linear-gradient(90deg,#27AEF3,#53E0EA);
 --na-cta-ink:#052033;
 --na-mural-font:"Caveat","Segoe Print","Bradley Hand",cursive;
 /* One typeface everywhere: Avenir Next / SF on Apple, Nunito Sans (bundled via Google Fonts) elsewhere,
    so Android and Windows never fall back to a different system font page by page. */
 --na-font:"Avenir Next","SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Nunito Sans","Segoe UI",sans-serif;
 --gsf-font:var(--na-font);
 /* Brand role tokens re-mapped onto the dark ground */
 --gsf-surface:var(--na-glass);
 --gsf-bg-soft:rgba(39,174,243,.10);
 --gsf-line:var(--na-edge);
 --gsf-ink:var(--na-text);
 --gsf-muted:var(--na-text-muted);
}
html,body{background:var(--na-bg);color:var(--na-text);font-family:var(--na-font)}
button,input,select,textarea{font-family:inherit}
/* Retina / high-density quality: crisp type, vector-sharp icons, smooth media scaling. */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%;text-size-adjust:100%}
svg{shape-rendering:geometricPrecision}
img,video{image-rendering:auto;-webkit-user-drag:none}
time,output,.tc,.timecode,[data-num]{font-variant-numeric:tabular-nums}
body{
 background:
  radial-gradient(60% 40% at 0% 18%,rgba(39,174,243,.20),transparent 70%),
  radial-gradient(55% 38% at 100% 46%,rgba(157,130,255,.16),transparent 70%),
  radial-gradient(60% 40% at 30% 100%,rgba(83,224,234,.10),transparent 70%),
  var(--na-bg);
 background-attachment:fixed;
}
::selection{background:rgba(39,174,243,.45);color:#fff}
:focus-visible{outline:2px solid #79D2FF;outline-offset:2px}
input,textarea,select{background:rgba(5,13,22,.55);color:var(--na-text);border-color:var(--na-edge)}
input::placeholder,textarea::placeholder{color:var(--na-text-faint)}
*{scrollbar-color:rgba(121,210,255,.25) transparent}
.na-glass{background:var(--na-glass);border:1px solid var(--na-edge);box-shadow:var(--na-shine);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.na-cta{background:var(--na-cta);color:var(--na-cta-ink);border:0;box-shadow:0 8px 24px rgba(39,174,243,.4)}
.na-mural{font-family:var(--na-mural-font);color:#79D2FF;font-weight:600}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* GSF_NIGHT_ARENA:END */
/* GSF_NIGHT_ARENA_PAGE:BEGIN */
/* Crea con IA on the Night Arena ground */
:root{--gsf-mural:#79D2FF;--gsf-mural-font:var(--na-mural-font);
 --gsf-sky:rgba(39,174,243,.16);--gsf-mint:rgba(94,214,160,.16);--gsf-sun:rgba(255,216,77,.16);--gsf-violet:rgba(157,130,255,.18);--gsf-rose:rgba(255,102,115,.16)}
html,body{background:var(--na-bg)}
#ai404{background:transparent}
.mural,.results-title,.empty-state,.change,.restore,.sheet-head h2{font-weight:700}
.mural{font-size:clamp(22px,5.6vw,30px)}
.pill{background:var(--na-glass);border-color:var(--na-edge);color:var(--na-text);box-shadow:var(--na-shine)}
.pill .dot{background:rgba(5,13,22,.6);color:var(--na-text-muted)}
.pill.ok .dot{background:rgba(94,214,160,.2);color:#A8F0CF}
/* The search orb: dark glass core with the brand ring */
.orb{background:radial-gradient(circle at 50% 35%,#12314B 0%,#0A1D2E 60%,#071522 100%);border:0;
 box-shadow:0 0 0 4px rgba(5,13,22,.9),0 0 0 6px rgba(39,174,243,.55),0 0 40px rgba(39,174,243,.45),0 0 90px rgba(157,130,255,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.orb:before{border-color:rgba(121,210,255,.22);border-style:dashed}
.orb:after{border-color:rgba(157,130,255,.16)}
.orb-icon{color:#79D2FF}
.orb-title{color:#fff}
.orb-sub{color:var(--na-text-muted)}
.orb-time{color:#fff}
@keyframes breathe{50%{box-shadow:0 0 0 4px rgba(5,13,22,.9),0 0 0 6px rgba(157,130,255,.7),0 0 60px rgba(157,130,255,.55),0 0 110px rgba(83,224,234,.3)}}
/* Engine bubbles glow in their own colour */
.bub{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.12),var(--tint));border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.eng b{color:#fff}
.eng .d{color:var(--na-text-muted)}
.eng.is-selected .bub{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 30%,transparent),0 0 34px color-mix(in srgb,var(--acc) 65%,transparent)}
.eng.is-selected b{color:color-mix(in srgb,var(--acc) 60%,#fff)}
.eng[data-engine="action"]{--acc:#FFD84D}
.eng[data-engine="reaction"]{--acc:#FF6673}
.eng[data-engine="best"]{--acc:#27AEF3}
.label{color:var(--na-text-muted)}
.seg{background:rgba(5,13,22,.55);border-color:var(--na-edge);box-shadow:none}
.seg button{color:var(--na-text-muted)}
.seg button.active{background:rgba(39,174,243,.22);color:#fff;box-shadow:var(--na-glow-primary)}
/* Results */
.results-title small{color:#B9A7FF}
.back{background:var(--na-glass);border-color:var(--na-edge);color:var(--na-text)}
.frame{border-color:rgba(121,210,255,.35);background:var(--na-deep);box-shadow:0 0 30px rgba(39,174,243,.3)}
.play{background:rgba(5,13,22,.45);border-color:rgba(255,255,255,.35);color:#fff}
.rank,.score{background:var(--na-glass-strong);border-color:var(--na-edge);color:var(--na-text)}
.score{color:#B9A7FF}
.short.is-selected .rank{background:linear-gradient(100deg,#9D82FF,#27AEF3);color:#fff}
.short.is-selected .frame{box-shadow:0 0 0 3px rgba(157,130,255,.6),0 0 46px rgba(157,130,255,.5)}
.card{background:var(--na-glass);border-color:var(--na-edge);box-shadow:var(--na-shine);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.card h2{color:#fff}
.card h2 .num{color:#B9A7FF}
.tc,.why{color:var(--na-text-muted)}
.tag{background:rgba(157,130,255,.18);color:#D6CBFF}
.tag.tag-2{background:rgba(39,174,243,.18);color:#9FDCFF}
.change{text-decoration-color:rgba(157,130,255,.7)}
.act{background:var(--na-glass);border-color:var(--na-edge);color:#fff;box-shadow:var(--na-shine)}
.act.ed .ic{background:rgba(39,174,243,.2);color:#9FDCFF;box-shadow:var(--na-glow-primary)}
.act.pub{background:linear-gradient(90deg,rgba(94,214,160,.22),rgba(83,224,234,.18));border-color:rgba(94,214,160,.45)}
.act.pub .ic{background:rgba(94,214,160,.25);color:#A8F0CF;box-shadow:var(--na-glow-short)}
/* Cambia short sheet */
.sheet-wrap{background:rgba(2,6,12,.6)}
.sheet{background:var(--na-glass-strong);border:1px solid var(--na-edge);border-bottom:0;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 -20px 50px rgba(0,0,0,.5)}
.sheet-head p,.alt .t{color:var(--na-text-muted)}
.close{background:rgba(255,255,255,.06);color:var(--na-text)}
.alt .thumb{border-color:rgba(121,210,255,.35);background:var(--na-deep);box-shadow:0 0 22px rgba(39,174,243,.25)}
.alt strong{color:#fff}
.sheet-empty{background:rgba(255,255,255,.04);color:var(--na-text-muted)}
/* One mural per screen, written with a marker */
@keyframes naPen{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.m2{display:none!important}
.m1{animation:naPen 1.1s cubic-bezier(.3,.7,.2,1) both}
/* AI made visible: results stream in one by one, the violet glow follows the confidence score */
@keyframes naArrive{from{opacity:0;transform:translateY(14px) scale(.9);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.short:not(.skel){animation:naArrive .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * .18s)}
.short:not(.skel) .frame{box-shadow:0 0 calc(10px + var(--conf,.5) * 40px) rgba(157,130,255,calc(.2 + var(--conf,.5) * .6))}
.short.is-selected:not(.skel) .frame{box-shadow:0 0 0 3px rgba(157,130,255,.6),0 0 calc(20px + var(--conf,.5) * 50px) rgba(157,130,255,calc(.3 + var(--conf,.5) * .6))}
/* Skeleton shimmer instead of an empty wait */
@keyframes naShimmer{from{background-position:-150% 0}to{background-position:250% 0}}
.short.skel{cursor:default}
.short.skel .frame{border-color:var(--na-edge);background:linear-gradient(100deg,rgba(255,255,255,.03) 20%,rgba(157,130,255,.22) 45%,rgba(83,224,234,.18) 55%,rgba(255,255,255,.03) 80%) var(--na-deep);background-size:200% 100%;animation:naShimmer 1.6s linear infinite;animation-delay:calc(var(--i,0) * .2s)}
.short.skel .frame:after{display:none}
/* GSF_NIGHT_ARENA_PAGE:END */

<main id="ai404"><div class="shell">

  <!-- VIEW 1: engines around the big circle -->

      <button class="eng e2" type="button" data-engine="action" aria-pressed="false"><span class="bub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5"/></svg></span><b>AZIONE</b><span class="d">Clutch, fight e flick</span></button>

      <button id="createAi" class="orb" type="button" data-alive-orb data-alive-round data-alive-next="create_with_ai retry" aria-label="TROVA I MOMENTI" disabled>

      <div class="side">
        <button id="changeSearch" class="back" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>Cambia motore</button>

    <div id="alts" class="alts"></div>
    <button id="restoreAi" class="restore" type="button" hidden>Ripristina la scelta dell'IA</button>
  </div>
</div>

<script>
/* GSF_ALIVE:BEGIN */
/* GSF Alive 2 (V418) — one nervous system for the whole app.
   Canonical source. Every surface inlines this file verbatim between
   GSF_ALIVE:BEGIN / GSF_ALIVE:END (tools/gsf_alive_inline.py, tests/test_alive_runtime_v418.py).

   Heard   — every tap gets an echo, every real event a heartbeat of the orb.
   Guided  — the next real step glows; after a quiet moment a handwritten whisper points at it.
   Carried — long work follows the user across pages (companion bubble, real timer),
             completion celebrates and leads straight to the next step.

   Rules (docs/architecture/gsf-alive.md): motion only from real state, never moves
   controls, quiet by default, prefers-reduced-motion respected, no fake progress. */
(() => {
  "use strict";
  const W = typeof window !== "undefined" ? window : globalThis;
  if (W.GSFAlive) return;

  /* ---------------------------------------------------------------- core */
  const KEY = "gsf_alive_v418";
  const JOB_TTL_MS = { upload: 10 * 60e3, ai: 6 * 60e3, render: 16 * 60e3, publish: 10 * 60e3 };
  const CELEBRATE_MS = 2600;
  const ERROR_CALM_MS = 3 * 60e3;   /* an error colours the app for 3 minutes, then calms */
  const ERROR_BUBBLE_MS = 90e3;     /* the "Riprova" bubble follows the user for 90 seconds */
  const BASE = {
    mode: "idle", video_ready: false, active_job: null, progress: null, job_started: 0, job_updated: 0,
    moments_count: 0, moment_selected: false, short_ready: false, published: false,
    ready_at: 0, error: null, error_job: null, error_at: 0, message: "Pronto quando vuoi.",
    social_connected: null, celebrate_until: 0, updated: 0, seq: 0, last: "",
  };
  const clamp01 = v => {
    let n = Number(v);
    if (!Number.isFinite(n)) return null;
    if (n > 1) n = n / 100;
    return Math.max(0, Math.min(1, n));
  };
  function calmMode(s, now) {
    if (s.celebrate_until && now < s.celebrate_until) return "celebrate";
    if (s.error && now - (Number(s.error_at) || Number(s.updated) || 0) < ERROR_CALM_MS) return "error";
    if (s.active_job) return "working";
    if (s.video_ready || s.short_ready) return "active";
    return "idle";
  }
  function startJob(s, job, now, extra) {
    const keep = s.active_job === job && s.job_started ? s.job_started : now;
    return Object.assign({}, s, { active_job: job, job_started: keep, job_updated: now, progress: null, error: null, error_job: null, error_at: 0 }, extra || {});
  }
  function reduce(prev, type, data, now) {
    const d = data || {};
    now = Number(now) || Date.now();
    let s = Object.assign({}, BASE, prev || {});
    switch (String(type || "")) {
      case "upload.started":
        s = startJob(s, "upload", now, { progress: 0, short_ready: false, published: false, moments_count: 0, moment_selected: false, video_ready: false, message: "Ricevuto. Carico il gameplay." });
        break;
      case "upload.progress": {
        if (s.active_job !== "upload") s = startJob(s, "upload", now, { short_ready: false, published: false, moments_count: 0, moment_selected: false, video_ready: false, message: "Carico il gameplay." });
        const p = clamp01(d.progress);
        if (p !== null) { s.progress = p; s.job_updated = now; }
        break;
      }
      case "upload.completed":
        s = Object.assign(s, { video_ready: true, active_job: null, progress: null, error: null, error_job: null, message: "Video pronto. Scegli come crearlo." });
        break;
      case "video.cleared":
        s = Object.assign({}, BASE, { social_connected: s.social_connected, message: "Pronto quando vuoi." });
        break;
      case "ai.started":
        s = startJob(s, "ai", now, { video_ready: true, moments_count: 0, moment_selected: false, message: "Guardo tutto il video per te." });
        break;
      case "ai.found": {
        const n = Math.max(0, Math.round(Number(d.count) || 0));
        s = Object.assign(s, { active_job: s.active_job === "ai" ? null : s.active_job, progress: null, error: null, error_job: null, moments_count: n, moment_selected: false,
          message: n === 1 ? "Ho trovato un momento forte." : n ? "Ho trovato " + n + " momenti forti." : "Nessun momento questa volta." });
        break;
      }
      case "moment.selected":
        s = Object.assign(s, { moment_selected: true, message: "Bella scelta." });
        break;
      case "editor.opened":
        s = Object.assign(s, { message: "Modifichiamola insieme." });
        break;
      case "editor.saved":
        s = Object.assign(s, { message: "Salvato." });
        break;
      case "render.started":
        s = startJob(s, "render", now, { short_ready: false, published: false, ready_at: 0, message: "Monto il tuo Short. Puoi continuare a navigare." });
        if (Number(d.started_at) > 0) s.job_started = Math.min(now, Number(d.started_at));
        break;
      case "render.progress": {
        const p = clamp01(d.progress);
        if (s.active_job === "render" && p !== null) { s.progress = p; s.job_updated = now; }
        break;
      }
      case "render.completed":
        s = Object.assign(s, { active_job: s.active_job === "render" ? null : s.active_job, progress: null, error: null, error_job: null, short_ready: true, video_ready: true, published: false, ready_at: now, celebrate_until: now + CELEBRATE_MS, message: "È pronto! Pubblichiamolo?" });
        break;
      case "render.cancelled":
        if (s.active_job === "render") s = Object.assign(s, { active_job: null, progress: null, message: "Pronto quando vuoi." });
        break;
      case "publish.started":
        s = startJob(s, "publish", now, { message: "Lo mando fuori." });
        break;
      case "publish.completed": {
        const ok = Math.max(0, Number(d.ok) || 0), ko = Math.max(0, Number(d.ko) || 0);
        s = Object.assign(s, { active_job: s.active_job === "publish" ? null : s.active_job, progress: null });
        if (ok > 0) {
          s.published = true; s.error = null; s.error_job = null;
          s.celebrate_until = now + CELEBRATE_MS;
          s.message = ko ? ok + " pubblicati, " + ko + " da riprovare." : "Pubblicato. Grande!";
        } else {
          s.error = "La pubblicazione non è riuscita."; s.error_job = "publish"; s.error_at = now;
          s.message = "La pubblicazione non è riuscita. Riproviamo.";
        }
        break;
      }
      case "social.status":
        if (s.social_connected === (Number(d.connected) > 0)) return Object.assign({}, s, { mode: calmMode(s, now) });
        s.social_connected = Number(d.connected) > 0;
        break;
      case "failure": {
        const msg = String(d.message || "Qualcosa si è fermato. Riproviamo.").slice(0, 140);
        s = Object.assign(s, { error: msg, error_job: d.job || s.active_job || null, error_at: now, active_job: null, progress: null, celebrate_until: 0, message: msg });
        break;
      }
      case "sync": {
        /* Silent facts a page already knows (a video restored after reload, a short ready on the server). */
        const before = JSON.stringify([s.video_ready, s.short_ready, s.moments_count, s.published]);
        if (typeof d.video_ready === "boolean") s.video_ready = d.video_ready;
        if (typeof d.short_ready === "boolean" && !(d.short_ready && s.active_job === "render")) s.short_ready = d.short_ready;
        if (typeof d.published === "boolean") s.published = d.published;
        if (Number.isFinite(Number(d.moments_count)) && d.moments_count !== undefined) s.moments_count = Math.max(0, Number(d.moments_count));
        if (!s.video_ready && !s.short_ready) { s.moments_count = 0; s.moment_selected = false; }
        if (JSON.stringify([s.video_ready, s.short_ready, s.moments_count, s.published]) === before) return Object.assign({}, prev || BASE, { mode: calmMode(prev || BASE, now) });
        break;
      }
      case "recovered":
        s = Object.assign(s, { error: null, error_job: null, message: "Ci siamo." });
        break;
      default:
        return Object.assign({}, s, { mode: calmMode(s, now) });
    }
    s.last = String(type);
    s.seq = (Number(prev && prev.seq) || 0) + 1;
    s.updated = now;
    s.mode = calmMode(s, now);
    return s;
  }
  /* Drop jobs that outlived any real run (a page closed mid-upload, a lost worker). */
  function expire(s, now) {
    if (!s) return s;

function createSelectedShort(){const payload=selectedPayload();alive("moment.selected",{index:payload.index});try{window.GSFAlive&&window.GSFAlive.watchRender()}catch(_e){}send("preview",{...payload,intent:"create_short"});send("create_short",payload)}

function ring(score,big){const r=46,c=2*Math.PI*r,v=Math.max(0,Math.min(100,score||0));return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="#E3F1FA" stroke-width="${big?3:2.4}"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="url(#gsfRing)" stroke-width="${big?3:2.4}" stroke-linecap="round" stroke-dasharray="${(c*v/100).toFixed(1)} ${c.toFixed(1)}"/><defs><linearGradient id="gsfRing"><stop offset="0" stop-color="#9D82FF"/><stop offset="1" stop-color="#53E0EA"/></linearGradient></defs></svg>`}

function renderMomentDots(){
  const host=$("momentDots"),r=rows();host.innerHTML="";
  r.forEach((_item,index)=>{const dot=document.createElement("button");dot.type="button";dot.className="moment-dot"+(Number(state.selectedMoment)===index?" is-selected":"");dot.setAttribute("aria-label",`Vai al momento ${index+1}`);dot.addEventListener("click",()=>selectMoment(index));host.appendChild(dot)});
}

function renderMoments(){
  const host=$("previews"),r=rows();host.innerHTML="";
  if(!r.length){host.innerHTML='<span class="sr">Sto preparando i tuoi momenti…</span>'+[0,1,2].map(i=>'<div class="short skel" style="--i:'+i+'" aria-hidden="true"><div class="frame"></div></div>').join("");renderMomentDots();return} /* GSF_NIGHT_ARENA: skeleton portals while the AI works */
  if(Number(state.selectedMoment)>=r.length)state.selectedMoment=0;
  r.forEach((item,index)=>{
    const sel=Number(state.selectedMoment)===index,score=scoreOf(item);
    const card=document.createElement("article");
    card.className="short"+(sel?" is-selected":"");card.dataset.index=String(index);card.style.setProperty("--i",String(index));card.style.setProperty("--conf",String(score===null?.5:Math.max(.2,score/100))); /* GSF_NIGHT_ARENA: results arrive one by one, glow follows confidence */card.tabIndex=0;card.setAttribute("role","button");card.setAttribute("aria-pressed",String(sel));card.setAttribute("aria-label",`Short ${index+1}: ${titleOf(item,index)}`);
    card.innerHTML=`<span class="ring">${ring(score,sel)}</span><div class="frame">${coverHTML(item)}</div>${item?.video||DEMO?`<button class="play" type="button" aria-label="Riproduci short ${index+1}"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M6 4.5v11l9-5.5Z"/></svg></button>`:""}<span class="rank">#${index+1}${index===0?" · MIGLIORE":""}</span>${score!==null?`<span class="score" title="Punteggio IA">${score}</span>`:""}`;
    card.addEventListener("click",e=>{if(e.target.closest(".play")||e.target.closest("video.live"))return;selectMoment(index)});
    card.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target===card){e.preventDefault();selectMoment(index)}});
    const play=card.querySelector(".play");if(play)play.addEventListener("click",e=>{e.stopPropagation();selectMoment(index);playIn(document.querySelector(`.short[data-index="${index}"]`),item)});
    host.appendChild(card)});
  renderMomentDots();
  requestAnimationFrame(()=>host.querySelector(`.short[data-index="${Number(state.selectedMoment)||0}"]`)?.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"}));
}
function renderDetail(){
  const r=rows(),i=Number(state.selectedMoment)||0,item=r[i];
  const off=!item||(Boolean(state.processing)&&!item.whole_source);
  $("createShort").disabled=off;$("editMoment").disabled=off;$("swapShort").disabled=off||Boolean(item?.whole_source);
  if(!item){$("detailNum").textContent="SHORT";$("detailTitle").textContent="";$("detailTime").textContent="";$("detailWhy").textContent="";$("detailTags").innerHTML="";return}
  const alts=altsFor(i),why=whyOf(item),tags=Array.isArray(item?.signals)?item.signals.slice(0,3):[];
  $("detailNum").textContent=`SHORT ${i+1}`;$("detailTitle").textContent=titleOf(item,i);
  const time=timeOf(item);$("detailTime").textContent=time?`${time} · ${lenOf(item)}`:lenOf(item);
  $("detailWhy").textContent=why||"Scelto dall'IA tra i momenti più forti del gameplay.";
  $("detailTags").innerHTML=tags.map((t,k)=>`<span class="tag${k?" tag-2":""}">${safe(t)}</span>`).join("");
  $("swapText").textContent=alts.length?`Cambia short · ${alts.length}`:"Cambia short";
}
function stopPlayback(){document.querySelectorAll(".frame.playing").forEach(f=>{f.querySelector("video.live")?.remove();f.classList.remove("playing")})}
function playIn(card,item){
  if(!card)return;stopPlayback();const frame=card.querySelector(".frame");
  if(!item?.video){frame.classList.add("playing");setTimeout(()=>frame.classList.remove("playing"),1200);return}
  const v=document.createElement("video");v.className="live";v.src=item.video;v.autoplay=true;v.playsInline=true;v.setAttribute("playsinline","");frame.appendChild(v);frame.classList.add("playing");
  v.addEventListener("click",e=>{e.stopPropagation();v.paused?v.play():v.pause()});
  v.addEventListener("ended",stopPlayback)}

/* ---------- Cambia short ---------- */
function altsFor(index){const it=rows()[index]||{};return Array.isArray(it.alternates)?it.alternates.slice(0,3):(Array.isArray(state.alternates)?state.alternates.slice(0,3):[])}
function openSheet(index){
  sheetIndex=index;const it=rows()[index]||{},alts=altsFor(index),box=$("alts");
  $("sheetTitle").textContent=`Cambia short ${index+1}`;box.innerHTML="";
  if(!alts.length){box.innerHTML='<div class="sheet-empty">L\'IA non ha altre scene abbastanza forti per questo short. Prova un altro motore o apri l\'editor per scegliere il momento a mano.</div>'}
  alts.forEach((a,i)=>{const b=document.createElement("button");b.type="button";b.className="alt";const sc=scoreOf(a);
    b.innerHTML=`<span class="thumb">${coverHTML(a)}</span><strong>${safe(titleOf(a,i+3))}</strong><span class="t">${safe(timeOf(a)||"Alternativa")}${sc!==null?" · "+sc:""}</span>`;
    b.addEventListener("click",()=>replaceShort(index,i));box.appendChild(b)});
  $("restoreAi").hidden=!it._replaced;$("sheetWrap").hidden=false;setTimeout(()=>$("sheetClose").focus(),30)}
function closeSheet(){$("sheetWrap").hidden=true;sheetIndex=-1}
function replaceShort(index,altIndex){
  const r=rows(),old=r[index],alts=altsFor(index).slice(),pick=alts[altIndex];if(!pick)return;
  alts.splice(altIndex,1,{...old,_replaced:false,alternates:undefined});
  const next={...pick,_replaced:true,_original:old._original||old,alternates:alts};
  state.previews=r.map((x,i)=>i===index?next:x);
  send("replace",{index,start_time:pick.start_time??pick.start,candidate_id:pick.candidate_id||""});
  setTimeout(()=>pollReplaced(index,pick.start_time??pick.start,Date.now()+90000),1500);
  closeSheet();state.selectedMoment=index;stopPlayback();renderMoments();renderDetail();
  const card=document.querySelector(`.short[data-index="${index}"]`);if(card){card.classList.add("swapping");setTimeout(()=>card.classList.remove("swapping"),650)}
  autosave("replace")}
function restoreShort(){const index=sheetIndex,it=rows()[index];if(!it||!it._original)return;state.previews=rows().map((x,i)=>i===index?{...it._original,alternates:it.alternates}:x);const o=it._original;send("replace",{index,restore:true,start_time:o.start_time??o.start});closeSheet();renderMoments();renderDetail();autosave("restore")}

/* ---------- render ---------- */
function render(){
  selectEngine(state.engine,false);selectDuration(state.duration,false);
  if(state.loaded)alive("sync",{video_ready:true});
  const cta=$("createAi");cta.disabled=!state.loaded||Boolean(state.processing);cta.classList.toggle("busy",Boolean(state.processing));
  if(!state.processing&&!failed)$("aiStatus").textContent=!state.loaded?"Prima carica un gameplay dalla Home":"Tocca il cerchio per partire";
  $("engineUsed").textContent=ENGINE_LABEL[state.engine]||"AUTO";
  const r=rows();
  updateOrb();renderMoments();renderDetail()}

let momentScrollTimer=0;
function syncMomentFromCarousel(){
  const host=$("previews"),cards=[...host.querySelectorAll(".short[data-index]")];if(!cards.length)return;
  const hr=host.getBoundingClientRect(),center=hr.left+hr.width/2;let best=cards[0],distance=Infinity;
  cards.forEach(card=>{const r=card.getBoundingClientRect(),d=Math.abs((r.left+r.width/2)-center);if(d<distance){distance=d;best=card}});
  const index=Number(best.dataset.index);if(Number.isInteger(index)&&index!==Number(state.selectedMoment))selectMoment(index);
}
$("previews").addEventListener("scroll",()=>{clearTimeout(momentScrollTimer);momentScrollTimer=setTimeout(syncMomentFromCarousel,130)},{passive:true});

/* ---------- events ---------- */
document.querySelectorAll("[data-engine]").forEach(c=>c.addEventListener("click",()=>selectEngine(c.dataset.engine,true)));
document.querySelectorAll("[data-duration]").forEach(b=>b.addEventListener("click",()=>selectDuration(b.dataset.duration,true)));
$("createAi").addEventListener("click",()=>{if(failed)setScan("off");startSearch()});
$("changeSearch").addEventListener("click",()=>{awaitingResults=false;pollToken++;state.processing=false;stopPlayback();setScan("off");showView("engines");send("change_engine");render()});
$("findMoreMoments").addEventListener("click",()=>{if(state.processing)return;stopPlayback();startSearch()});
$("createShort").addEventListener("click",createSelectedShort);
$("editMoment").addEventListener("click",editSelectedMoment);
$("swapShort").addEventListener("click",()=>openSheet(Number(state.selectedMoment)||0));
$("sheetClose").addEventListener("click",closeSheet);
$("restoreAi").addEventListener("click",restoreShort);
$("sheetWrap").addEventListener("click",e=>{if(e.target===$("sheetWrap"))closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheetWrap").hidden)closeSheet()});
window.addEventListener("message",event=>{
  if(event.origin!==location.origin||!event.data||event.data.type!=="GSF_AI_STATE")return;
  const incoming={...event.data.state};const list=incoming.previews;delete incoming.previews;
  state={...state,...incoming};if(!Number.isInteger(Number(state.selectedMoment)))state.selectedMoment=0;
  const hasPreviews=Array.isArray(list)&&list.length>0;
  if(hasPreviews&&applyResults(list))return;
  render()});

/* ---------- demo host (preview only: simulates the app with example data) ---------- */
function demoHost(action,data){
  const toast=t=>{let el=$("demoToast");if(!el){el=document.createElement("div");el.id="demoToast";el.style.cssText="position:fixed;z-index:60;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);padding:9px 16px;border-radius:999px;background:#0D2A66;color:#fff;font-size:12px;font-weight:800;box-shadow:0 10px 30px rgba(13,42,102,.25);max-width:calc(100% - 32px);text-align:center";document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,2200)};
  if(action==="create")setTimeout(()=>{runInfo={pool:14};applyResults(DEMO_SHORTS(state.engine,state.duration))},4200);
  if(action==="create_short")toast("Esempio: qui si apre la pubblicazione dello short "+(data.index+1));
  if(action==="open_editor")toast("Esempio: qui si apre il Game Editor sullo short "+(data.index+1));
}
const DEMO_SHORTS=(engine,dur)=>{
  const base={auto:[["Triplo kill sul ponte","Azione e voce insieme: il momento più completo del video.",["Kill multipla","Voce alta"],94,262],["Rimonta all'ultimo cerchio","Tensione che sale e chiusura netta.",["Clutch","Racconto"],88,611],["Salto impossibile","Movimento esplosivo, sorpresa finale.",["Azione"],81,138]],
    action:[["Flick 180° in aria","Il picco di movimento più alto del video.",["Flick","Movimento"],93,402],["1 contro 3 nel magazzino","Combattimento serrato, zero tempi morti.",["Fight","Kill"],89,95],["Triplo kill sul ponte","Tre eliminazioni in pochi secondi.",["Kill multipla"],84,262]],
    reaction:[["\"Non ci credo!\"","La tua reazione più forte, con il gameplay che la spiega.",["Urlo","Sorpresa"],92,517],["Fail clamoroso","Risata e caduta: perfetto per i commenti.",["Fail","Risata"],86,44],["Panico sul tetto","La voce sale insieme al pericolo.",["Voce alta"],79,330]],
    best:[["Rimonta all'ultimo cerchio","Inizio, picco e chiusura chiari in "+dur+" secondi.",["Racconto","Vittoria"],91,611],["Imboscata perfetta","Preparazione lenta, esplosione finale.",["Setup","Kill"],85,201],["Ultimo respiro","Ti salvi per un soffio e chiudi il round.",["Clutch"],80,455]]}[engine]||[];
  const mk=(r,i,h)=>({index:i,label:r[0],why:r[1],signals:r[2],score:r[3],start_time:r[4],end_time:r[4]+dur,video:"",_hue:h});
  const altsRaw=[["Sorpasso nel vicolo","Buon ritmo, meno intenso dei primi tre.",["Azione"],74,720],["Granata al millimetro","Un'eliminazione pulita, finale breve.",["Kill"],71,180],["Ritorno dal respawn","Piccola rimonta con un arco chiaro.",["Racconto"],66,840]];
  return base.map((r,i)=>({...mk(r,i,[205,262,320][i]),alternates:altsRaw.map((a,j)=>mk(a,3+j,[150,30,95][j]))}));
};

/* ---------- shell fit: stay between the shell header and the Game Bar ---------- */
function fitShell(){
  let top=0,bottom=0;
  try{
    const P=window.parent,fe=window.frameElement;
    if(P&&P!==window&&fe){
      const fr=fe.getBoundingClientRect(),d=P.document;
      const shown=el=>{if(!el)return null;const cs=P.getComputedStyle(el);if(cs.display==="none"||cs.visibility==="hidden"||Number(cs.opacity)===0)return null;const r=el.getBoundingClientRect();return r.width&&r.height?r:null};
      const h=shown(d.getElementById("gsf-global-header"));
      if(h&&h.bottom>fr.top&&h.top<fr.top+fr.height/2)top=h.bottom-fr.top;
      ["gsf-global-gamebar","gsf-global-footer"].forEach(id=>{const r=shown(d.getElementById(id));if(r&&r.top<fr.bottom&&r.bottom>fr.top+fr.height/2)bottom=Math.max(bottom,fr.bottom-r.top+8)});
      const cap=fr.height*.35;top=Math.min(Math.max(0,Math.round(top)),cap);bottom=Math.min(Math.max(0,Math.round(bottom)),cap);
    }
  }catch(_e){top=0;bottom=0}
  const root=document.documentElement;
  if(root.style.getPropertyValue("--shell-top")!==top+"px")root.style.setProperty("--shell-top",top+"px");
  if(root.style.getPropertyValue("--shell-bottom")!==bottom+"px")root.style.setProperty("--shell-bottom",bottom+"px");
}
fitShell();
window.addEventListener("resize",fitShell);
try{window.parent.addEventListener("resize",fitShell,{passive:true});const RO=window.parent.ResizeObserver;if(RO&&window.frameElement)new RO(fitShell).observe(window.frameElement)}catch(_e){}
document.addEventListener("visibilitychange",fitShell);
setInterval(()=>{if(!document.hidden)fitShell()},1200);

/* ---------- boot ---------- */
const draft=store.get();
if(DEMO)state={...state,loaded:true};
if(draft&&!DEMO){state={...state,engine:ENGINE_LABEL[draft.engine]?draft.engine:state.engine,duration:draft.duration||state.duration}}
send("ready");showView("engines");setMurals("idle");render();
})();

(()=>{if(/[?&]demo=1/.test(location.search)||!window.GSFAlive)return;window.GSFAlive.mount({page:"ai",voiceAnchor:"#createAi"})})();
